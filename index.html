async function downloadKpiExcel(){
  const btnExp = document.getElementById("btnExportKpi");
  const kd = computeKpiData();

  // Лист 1 — KPI по менеджерам (как на экране)
  const sheet1Rows = [];
  const headerRow1 = [{val:"Менеджер", style:1}];
  kd.buckets.forEach(b=>{
    headerRow1.push({val:kd.bucketLabels[b]+" — всего", style:1});
    headerRow1.push({val:kd.bucketLabels[b]+" — заказ", style:1});
    headerRow1.push({val:kd.bucketLabels[b]+" — конв. %", style:1});
  });
  headerRow1.push({val:"Итого — всего", style:1}, {val:"Итого — заказ", style:1}, {val:"Итого — конв. %", style:1});
  sheet1Rows.push(headerRow1);

  kd.perManager.forEach(r=>{
    const row = [{val:r.manager}];
    kd.buckets.forEach(b=>{
      const s = r.byBucket[b];
      row.push({val:s.total,type:"Number"}, {val:s.done,type:"Number"}, {val:Number(s.conv.toFixed(0)),type:"Number"});
    });
    row.push({val:r.totalStats.total,type:"Number"}, {val:r.totalStats.done,type:"Number"}, {val:Number(r.totalStats.conv.toFixed(0)),type:"Number"});
    sheet1Rows.push(row);
  });

  const footRow = [{val:"Итого по всем", style:1}];
  kd.buckets.forEach(b=>{
    const s = kd.grand[b];
    footRow.push({val:s.total,type:"Number",style:1}, {val:s.done,type:"Number",style:1}, {val:Number(s.conv.toFixed(0)),type:"Number",style:1});
  });
  footRow.push({val:kd.grandTotal.total,type:"Number",style:1}, {val:kd.grandTotal.done,type:"Number",style:1}, {val:Number(kd.grandTotal.conv.toFixed(0)),type:"Number",style:1});
  sheet1Rows.push(footRow);

  // Лист 2 — список клиентов за выбранный на дашборде период (по дате регистрации)
  const clientHeader = ["Код","Компания","Менеджер","Менеджер ведения","Раздел","Источник","Отрасль","Дивизион","Этап","Статус","Регион","Статус контрагента (справочно)","Скоринг","Сегмент","Дата регистрации","Дата последнего контакта","Дата передачи","Комиссия менеджеру до","Комиссия активна"];
  const sheet2Rows = [ clientHeader.map(h=>({val:h, style:1})) ];
  kd.source
    .slice()
    .sort((a,b)=> (a.company||"").localeCompare(b.company||"","ru"))
    .forEach(c=>{
      const s = computeScores(c);
      const ci = commissionInfo(c);
      sheet2Rows.push([
        {val:c.code||""},
        {val:c.company||""},
        {val:c.manager||""},
        {val:c.accountManager||""},
        {val:c.tab==="dormant"?"Спящие клиенты":"Входящие и исходящие"},
        {val:kd.bucketLabels[bucketOf(c)]||""},
        {val:c.industry||""},
        {val:s.division||""},
        {val:c.stage||""},
        {val:c.status||""},
        {val:c.region||""},
        {val:c.counterpartyStatusRef||""},
        {val:s.total!=null?s.total:"", type:s.total!=null?"Number":"String"},
        {val:s.segment?s.segment.code:""},
        {val:fmtDate(c.registrationDate)},
        {val:fmtDate(c.lastContactDate)},
        {val:fmtDate(c.transferDate)},
        {val:ci&&ci.until?fmtDate(ci.until):""},
        {val:ci?(ci.active?"да":"нет"):""},
      ]);
    });

  // Лист 3 — «Передача в дивизион» (готовы к передаче, как во вкладке)
  const ready = Array.from(clients.entries()).filter(([,c])=>computeScores(c).readyForTransfer);
  ready.sort((a,b)=> (a[1].lastContactDate||"").localeCompare(b[1].lastContactDate||""));
  const sheet3Rows = [ ["Код","Компания","Менеджер","Отрасль","Регион","Статус контрагента (справочно)","Дата регистрации","Контактное лицо","Телефон","Email","Доп. контакты","Следующий шаг / комментарий","Посл. контакт","Подготовка к передаче"].map(h=>({val:h, style:1})) ];
  ready.forEach(([,c])=>{
    const h = c.handover||{};
    const filled = Boolean(c.contactPerson && c.phone && c.email && h.agreements && h.nextOrders);
    sheet3Rows.push([
      {val:c.code||""},
      {val:c.company||""},
      {val:c.manager||""},
      {val:c.industry||""},
      {val:c.region||""},
        {val:c.counterpartyStatusRef||""},
      {val:fmtDate(c.registrationDate)},
      {val:c.contactPerson||""},
      {val:c.phone||""},
      {val:c.email||""},
      {val:extraContactsText(c)},
      {val:c.nextStep||""},
      {val:fmtDate(c.lastContactDate)},
      {val: filled ? "заполнено" : "нужно заполнить"},
    ]);
  });

  // Лист 4 — «Переданные (комиссия)» (как во вкладке)
  const transferred = Array.from(clients.entries()).filter(([,c])=>c.status==="Передан в дивизион");
  const withInfo = transferred.map(([id,c])=>({id,c,ci:commissionInfo(c)}));
  withInfo.sort((a,b)=>{
    if (!a.ci.transferDate && !b.ci.transferDate) return 0;
    if (!a.ci.transferDate) return -1;
    if (!b.ci.transferDate) return 1;
    return a.ci.until.localeCompare(b.ci.until);
  });
  const sheet4Rows = [ ["Код","Компания","Менеджер","Отрасль","Регион","Статус контрагента (справочно)","Дата передачи","Статус комиссии"].map(h=>({val:h, style:1})) ];
  withInfo.forEach(({c,ci})=>{
    let statusText;
    if (!ci.transferDate) statusText = "дата не указана";
    else statusText = ci.active ? `активна до ${fmtDate(ci.until)}` : `истекла ${fmtDate(ci.until)}`;
    sheet4Rows.push([
      {val:c.code||""},
      {val:c.company||""},
      {val:c.manager||""},
      {val:c.industry||""},
      {val:c.region||""},
        {val:c.counterpartyStatusRef||""},
      {val:fmtDate(ci.transferDate)},
      {val:statusText},
    ]);
  });

  // Лист 5 — «Менеджеры ведения» (отдельная сводка, как на дашборде)
  const amd = computeAccountManagerBreakdown(kd.source);
  const sheet5Rows = [ ["Менеджер ведения","Клиентов","Заказ","Конв. %"].map(h=>({val:h, style:1})) ];
  amd.rows.forEach(r=>{
    sheet5Rows.push([
      {val:r.manager},
      {val:r.stats.total, type:"Number"},
      {val:r.stats.done, type:"Number"},
      {val:Number(r.stats.conv.toFixed(0)), type:"Number"},
    ]);
  });
  sheet5Rows.push([
    {val:"Итого по всем", style:1},
    {val:amd.grandTotal.total, type:"Number", style:1},
    {val:amd.grandTotal.done, type:"Number", style:1},
    {val:Number(amd.grandTotal.conv.toFixed(0)), type:"Number", style:1},
  ]);

  const zipBlob = buildXlsxBlob([
    {name:"KPI по менеджерам", rows: sheet1Rows},
    {name:"Клиенты", rows: sheet2Rows},
    {name:"Передача в дивизион", rows: sheet3Rows},
    {name:"Переданные (комиссия)", rows: sheet4Rows},
    {name:"Менеджеры ведения", rows: sheet5Rows},
  ]);

  let periodSuffix = "";
  if (kpiPeriod.from && kpiPeriod.to) periodSuffix = `_${kpiPeriod.from}_${kpiPeriod.to}`;
  else if (kpiPeriod.from) periodSuffix = `_с_${kpiPeriod.from}`;
  else if (kpiPeriod.to) periodSuffix = `_по_${kpiPeriod.to}`;
  if (btnExp){ btnExp.disabled = true; btnExp.textContent = "Готовим файл…"; }
  try {
    saveBlobAsFile(`CRM_KPI_${todayISO()}${periodSuffix}.xlsx`, zipBlob);
  } catch(e){
    alert("Не удалось скачать файл: "+(e&&e.message?e.message:"неизвестная ошибка"));
  } finally {
    if (btnExp){ btnExp.disabled = false; btnExp.textContent = "⬇ Скачать Excel"; }
  }
}

function openDrawer(id, newTab){
  const isNew = !id;
  const draft = isNew ? blankClient(newTab) : JSON.parse(JSON.stringify(clients.get(id)));
  drawerState = { id, isNew, draft };
  drawerBusy = false;
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("backdrop").onclick = closeDrawer;
  renderDrawer();
  requestAnimationFrame(()=> document.getElementById("drawer").classList.add("show"));
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("backdrop").classList.remove("show");
  setTimeout(()=>{ drawerState=null; document.getElementById("drawer").innerHTML=""; }, 200);
}

function fieldOpts(list, value, placeholder){
  let html = placeholder ? `<option value="">${esc(placeholder)}</option>` : "";
  list.forEach(v=>{ html += `<option value="${esc(v)}" ${v===value?"selected":""}>${esc(v)}</option>`; });
  return html;
}

  const { id, isNew, draft } = drawerState;
  const s = computeScores(draft);

  drawer.innerHTML = `
    <div class="drawer-head">
      <div style="flex:1;">
        <h2>${isNew? "Новый клиент" : esc(draft.company||"Без названия")+copyBtnHtml(draft.company)}</h2>

          ${dupCount>1?'<span class="warnflag"> · ⚠ код встречается ещё в '+(dupCount-1)+' карточке(ах)</span>':''}

      <button class="btn subtle sm" id="btnClose">Закрыть</button>

function wireDrawerInputs(){
  const { draft } = drawerState;
  const bind = (id, path, transform)=>{
    const el = document.getElementById(id);
    if (!el) return;
    const ev = (el.tagName==="SELECT"||el.type==="date"||el.type==="checkbox") ? "change" : "input";
    el.addEventListener(ev, ()=>{
      let v = el.type==="checkbox" ? el.checked : el.value;
      if (transform) v = transform(v);
      setPath(draft, path, v);
      onDraftChanged();
    });
  };
  const setPath = (obj, path, v)=>{
    const parts = path.split(".");
    let o = obj;
    for (let i=0;i<parts.length-1;i++) o = o[parts[i]];
    o[parts[parts.length-1]] = v;
  };

  bind("f_company","company");
  bind("f_code","code");
  bind("f_manager","manager");
  bind("f_accountManager","accountManager");
  bind("f_regdate","registrationDate");
  bind("f_source","source");
  bind("f_region","region");
  bind("f_site","website");
  bind("f_counterparty","counterpartyStatusRef");
  bind("f_industry","industry", v=>v||null);
  bind("f_size","companySize", v=>v||null);
  bind("f_volume","potentialVolume", v=>v||null);
  bind("f_flowhist","flowHistory", v=>v||null);
  bind("f_stage","stage", v=>v||null);
  bind("f_lastcontact","lastContactDate", v=>v||null);
  bind("f_transferdate","transferDate", v=>v||null);
  bind("f_revenue","revenue2025", v=>v===""?null:Number(v));
  bind("f_agreements","handover.agreements");
  bind("f_nextorders","handover.nextOrders");
  bind("f_openq","handover.openQuestions");
  bind("f_reason_other","rejectionReasonOther");

  document.querySelectorAll("[data-eng]").forEach(el=>{
    el.addEventListener("change", ()=>{ draft.engagement[el.getAttribute("data-eng")] = el.checked; onDraftChanged(); });
  });

  if (!Array.isArray(draft.contacts) || draft.contacts.length===0) draft.contacts = [{name:"",role:"",email:"",phone:""}];
  document.querySelectorAll("[data-contact-field]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const idx = Number(el.getAttribute("data-idx"));
      const field = el.getAttribute("data-contact-field");
      if (!draft.contacts[idx]) draft.contacts[idx] = {name:"",role:"",email:"",phone:""};
      draft.contacts[idx][field] = el.value;
      syncPrimaryContactMirror(draft);
      onDraftChanged();
    });
  });
  document.querySelectorAll("[data-remove-contact]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = Number(el.getAttribute("data-remove-contact"));
      draft.contacts.splice(idx,1);
      syncPrimaryContactMirror(draft);
      renderDrawerBody();
    });
  });
  const btnAddContact = document.getElementById("btnAddContact");
  if (btnAddContact) btnAddContact.addEventListener("click", ()=>{
    if (!Array.isArray(draft.contacts)) draft.contacts = [];
    draft.contacts.push({name:"",role:"",email:"",phone:""});
    renderDrawerBody();
  });

  const btnAddNote = document.getElementById("btnAddNote");
  if (btnAddNote) btnAddNote.addEventListener("click", ()=> addNoteAndSave());
  const statusSel = document.getElementById("f_status");
  if (statusSel) statusSel.addEventListener("change", ()=>{
    draft.status = statusSel.value;
    if (draft.status!=="Отказ"){ draft.rejectionReason=null; draft.rejectionReasonOther=""; }
    if (draft.status==="Передан в дивизион" && !draft.transferDate){ draft.transferDate = todayISO(); }
    renderDrawerBody();
  });
  const reasonSel = document.getElementById("f_reason");
  if (reasonSel) reasonSel.addEventListener("change", ()=>{
    draft.rejectionReason = reasonSel.value || null;
    renderDrawerBody();
  });
}

function onDraftChanged(){
  const { draft } = drawerState;
  const s = computeScores(draft);
  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
  set("sc_icp", s.icp); set("sc_vol", s.volume); set("sc_eng", s.eng); set("sc_hist", s.historyPts); set("sc_total", s.total);
  const segEl = document.getElementById("sc_segment");
  if (segEl) segEl.innerHTML = `<span class="pill ${s.segment.style}" style="font-size:14px;padding:6px 14px;">${s.segment.code} · ${esc(s.segment.label)}</span><div class="helptext" style="max-width:200px;text-align:right;">${esc(s.segment.desc)}</div>`;
  const note = document.getElementById("autoHistoryNote");
  if (note) note.innerHTML = `История (авто по дате регистрации): <b>${esc(s.historyLabel)}</b>`;
  const badges = document.querySelector(".readonlybadges");
  if (badges) badges.innerHTML = `
    <span class="pill ${s.division==="Стандарт"?"info":"violet"}">Дивизион: ${esc(s.division)}</span>
    <span class="pill ${s.readyForTransfer?"good":"neutral"}">${s.readyForTransfer?"Готов к передаче":"Пока не готов к передаче"}</span>`;
  const commBanner = document.getElementById("commissionBanner");
  if (commBanner) commBanner.innerHTML = commissionBannerHtml(draft);
}

// Заметка сохраняется в базу сразу по кнопке «Добавить заметку», а не только по
// общей кнопке «Сохранить» — раньше её было легко забыть нажать, и заметка терялась.
// У нового (ещё не созданного) клиента писать в базу нечего — заметка уйдёт вместе
// с карточкой при первом сохранении, как и раньше.
async function addNoteAndSave(){
  if (!drawerState) return;
  const { id, isNew, draft } = drawerState;
  const noteInput = document.getElementById("f_newnote");
  const text = (noteInput && noteInput.value || "").trim();
  if (!text) return;
  if (!Array.isArray(draft.notes)) draft.notes = [];
  draft.notes.push({ text, at: nowISO(), by: currentManager() || "" });
  draft.nextStep = text; // "зеркало" последней заметки — для списков и выгрузок, которые ещё смотрят на nextStep
  if (!isNew){
    draft.updatedAt = nowISO();
    draft.updatedBy = currentManager() || draft.updatedBy || "";
  }
  renderDrawerBody();
  if (isNew || !db) return;
  const btn = document.getElementById("btnAddNote");
  if (btn){ btn.disabled = true; btn.textContent = "Сохраняем…"; }
  try{
    // Частичное обновление — уходят только заметки/следующий шаг, а не весь черновик
    // карточки, чтобы случайно не сохранить в базу другие поля, которые менеджер ещё
    // не закончил редактировать и не подтвердил кнопкой «Сохранить».
    await db.doc("clients/"+id).update({
      notes: draft.notes,
      nextStep: draft.nextStep,
      updatedAt: draft.updatedAt,
      updatedBy: draft.updatedBy,
    });
    toast("Заметка сохранена");
  }catch(e){
    console.error(e);
    toast("Заметка не сохранилась в базе (" + formatDbError(e) + ") — нажмите «Сохранить», чтобы не потерять её");
  } finally {
    const btnAfter = document.getElementById("btnAddNote");
    if (btnAfter){ btnAfter.disabled = false; btnAfter.textContent = "Добавить заметку"; }
  }
}

async function saveDrawer(){
  if (drawerBusy) return;
  const { id, isNew, draft } = drawerState;
  if (!draft.company || !draft.company.trim()){
    toast("Укажите название компании");
    return;
  }
  if (isNew){
    let dups = [];
    try{
      dups = findPossibleDuplicates(draft, id);
    }catch(e){
      // проверка на дубли — вспомогательная; если она сама сломалась на каких-то
      // старых данных, это не должно мешать сохранению нового клиента
      console.error(e);
    }
    if (dups.length){
      const listHtml = dups.slice(0,5).map(d=>
        `<div class="muted" style="font-size:13px;">— <b>${esc(d.c.company||"—")}</b> (совпадение ${esc(d.reason)}${d.c.code?", код "+esc(d.c.code):""}, менеджер: ${esc(d.c.manager||"—")})</div>`
      ).join("");
      const moreHtml = dups.length>5 ? `<div class="muted" style="font-size:12px;">…и ещё ${dups.length-5}</div>` : "";
      const proceed = await showConfirmModal({
        title: "Похоже, такой клиент уже есть",
        bodyHtml: `<div style="display:flex;flex-direction:column;gap:4px;margin:4px 0 8px;">${listHtml}${moreHtml}</div><div class="helptext">Сохранить всё равно, или отменить и проверить карточку?</div>`,
      });
      if (!proceed) return;
    }
  }
  await performSaveDrawer();
}

function formatDbError(e){
  if (!e) return "неизвестная ошибка";
  if (typeof e === "string") return e;
  if (e instanceof Error) return e.message || String(e);
  return e.message || e.details || e.hint || (e.code ? ("код "+e.code) : "") || "неизвестная ошибка — подробности в логе (кнопка «Лог» в шапке)";
}

function isTransientNetworkError(e){
  const msg = String((e && (e.message || e)) || "");
  return /load failed|failed to fetch|networkerror|network request failed|network connection was lost/i.test(msg);
}
function setDrawerButtonsDisabled(disabled){
  const saveBtn = document.getElementById("btnSave");
  const delBtn = document.getElementById("btnDelete");
  if (saveBtn){ saveBtn.disabled = disabled; saveBtn.textContent = disabled ? "Сохраняем…" : "Сохранить"; }
  if (delBtn){ delBtn.disabled = disabled; }
}

async function performSaveDrawer(retryCount){
  retryCount = retryCount || 0;
  const { id, isNew, draft } = drawerState;
  draft.updatedAt = nowISO();
  draft.updatedBy = currentManager() || draft.updatedBy || "";
  if (!Array.isArray(draft.statusHistory)) draft.statusHistory = [];
  if (!Array.isArray(draft.changeLog)) draft.changeLog = [];
  const manager = currentManager() || "";
  if (isNew){
    draft.statusHistory = [{status: draft.status, at: nowISO(), by: manager}];
  } else {
    const prev = clients.get(id);
    const prevStatus = prev ? prev.status : null;
    if (prevStatus !== draft.status){
      draft.statusHistory = [...draft.statusHistory, {status: draft.status, at: nowISO(), by: manager}];
    }
    if (prev){
      // логируем правки важных полей — отдельно от истории статусов, т.к. именно
      // смена отрасли уже один раз "тихо" разошлась со вкладкой «Отгрузки»
      const changes = [];
      if ((prev.industry||"") !== (draft.industry||"")){
        changes.push({field:"Отрасль", from: prev.industry||"—", to: draft.industry||"—"});
      }
      if ((prev.manager||"") !== (draft.manager||"")){
        changes.push({field:"Менеджер", from: prev.manager||"—", to: draft.manager||"—"});
      }
      if ((prev.accountManager||"") !== (draft.accountManager||"")){
        changes.push({field:"Менеджер ведения", from: prev.accountManager||"—", to: draft.accountManager||"—"});
      }
      const prevContactsStr = contactsSummary(prev.contacts);
      const draftContactsStr = contactsSummary(draft.contacts);
      if (prevContactsStr !== draftContactsStr){
        changes.push({field:"Контакты", from: prevContactsStr, to: draftContactsStr});
      }
      if (changes.length){
        const at = nowISO();
        draft.changeLog = [...draft.changeLog, ...changes.map(c=>({...c, at, by: manager}))];
      }
    }
  }
  if (!db){ toast("База данных недоступна"); return; }
  drawerBusy = true;
  setDrawerButtonsDisabled(true);
  try{
    if (isNew){
      draft.createdAt = nowISO();
      await db.collection("clients").add(draft);
      toast("Клиент добавлен");
    } else {
      await db.doc("clients/"+id).set(draft);
      toast("Сохранено");
    }
    drawerBusy = false;
    closeDrawer();
  }catch(e){
    console.error(e);
    if (isTransientNetworkError(e) && retryCount<1){
      logEvent("retry", "Сетевая ошибка при сохранении — пробуем ещё раз через 1с", e);
      setTimeout(()=>{ performSaveDrawer(retryCount+1); }, 1000);
      return; // остаёмся в состоянии "занято" на время повтора
    }
    drawerBusy = false;
    setDrawerButtonsDisabled(false);
    toast("Ошибка сохранения: "+formatDbError(e));
  }
}
async function deleteDrawer(retryCount){
  retryCount = retryCount || 0;
  if (drawerBusy) return;
  const { id, draft } = drawerState;
  if (!retryCount && !confirm("Удалить карточку «"+draft.company+"»? Это необратимо.")) return;
  drawerBusy = true;
  setDrawerButtonsDisabled(true);
  try{
    await db.doc("clients/"+id).delete();
    toast("Удалено");
    drawerBusy = false;
    closeDrawer();
  }catch(e){
    console.error(e);
    if (isTransientNetworkError(e) && retryCount<1){
      logEvent("retry", "Сетевая ошибка при удалении — пробуем ещё раз через 1с", e);
      setTimeout(()=>{ deleteDrawer(retryCount+1); }, 1000);
      return;
    }
    drawerBusy = false;
    setDrawerButtonsDisabled(false);
    toast("Ошибка удаления: "+formatDbError(e));
  }
}

/* =====================================================================
   AUTH — вход по email/паролю (Supabase Auth), сопоставление с менеджером
   ===================================================================== */
async function resolveIdentity(session){
  const email = session.user.email;
  const { data, error } = await supabase.from("managers").select("display_name,role").eq("email", email).maybeSingle();
  if (error || !data){
    throw new Error("Этот email не найден в списке менеджеров. Обратитесь к администратору.");
  }
  CURRENT_USER = { email, displayName: data.display_name, role: data.role };
  logEvent("auth", "Сессия распознана: "+data.display_name+" ("+data.role+")");
}

function showLogin(msg){
  const loginEl = document.getElementById("loginScreen");
  const appEl = document.getElementById("app");
  if (loginEl) loginEl.hidden = false;
  if (appEl) appEl.hidden = true;
  const err = document.getElementById("loginError");
  if (err) err.textContent = msg || "";
}

async function showApp(){
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("app").hidden = false;
  await initDb();
}

async function boot(){
  const { data:{ session } } = await supabase.auth.getSession();
  if (session){
    try{
      await resolveIdentity(session);
      await showApp();
      return;
    }catch(e){
      await supabase.auth.signOut().catch(()=>{});
      showLogin(e.message);
      return;
    }
  }
  showLogin();
}

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Входим…";
  try{
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await resolveIdentity(data.session);
    logEvent("auth", "Вход выполнен: "+email);
    await showApp();
  }catch(ex){
    err.textContent = (ex.message==="Invalid login credentials") ? "Неверный email или пароль" : ex.message;
    logEvent("auth-error", "Ошибка входа для "+email, ex);
    await supabase.auth.signOut().catch(()=>{});
  }finally{
    btn.disabled = false; btn.textContent = "Войти";
  }
});

document.getElementById("btnLogout").addEventListener("click", async ()=>{
  logEvent("auth", "Выход из аккаунта");
  if (unsub){ try{ unsub(); }catch(e){} }
  await supabase.auth.signOut();
  location.reload();
});

document.getElementById("btnDownloadLog").addEventListener("click", downloadAppLog);
document.getElementById("btnDownloadLogLogin").addEventListener("click", downloadAppLog);

/* =====================================================================
   BOOT
   ===================================================================== */
document.addEventListener("keydown", (e)=>{
  if (e.key!=="Escape") return;
  const tcm = document.getElementById("tcmBackdrop");
  if (tcm && !tcm.hidden){ tcm.hidden = true; return; }
  if (drawerState) closeDrawer();
});
boot();

})();
</script>

function hash(a,b){ var h=(a*374761393+b*668265263)^0x5bd1e995; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; }
function vnoise(x,y){ var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi; var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return vnoise(x,y)*.6+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.1; }
function hexXY(q,r){ return {x:HEX*Math.sqrt(3)*(q+r/2), y:HEX*1.5*r}; }

function layoutGroup(list){
  var n=list.length, R=Math.ceil(Math.sqrt(n/2.6))+4, slots=[];

    var s=-q-r; var d=Math.max(Math.abs(q),Math.abs(r),Math.abs(s));
    if(d>R) continue;
    var p=hexXY(q,r); var nz=fbm(p.x/90+7,p.y/90+3);

  var order={empire:0,colony:1,front:2,fog:3};

  core.sort(function(a,b){ return order[a.cat]-order[b.cat] || b.score-a.score; });

    minX=Math.min(minX,s.x);maxX=Math.max(maxX,s.x);minY=Math.min(minY,s.y);maxY=Math.max(maxY,s.y); });

// у каждого менеджера своя земля (материк); не-админ видит только свою
function layout(list){
  var map={}, names=[];
  list.forEach(function(t){ var k=S.admin?(t.c.manager||'Без командира'):S.me; if(!map[k]){ map[k]=[]; names.push(k); } map[k].push(t); });
  names.sort(function(a,b){ return map[b].length-map[a].length; });
  var SX=HEX*Math.sqrt(3), SY=HEX*1.5, cursor=0, all=[], gmin=1e9,gmax=-1e9,ymin=1e9,ymax=-1e9;

  names.forEach(function(nm,gi){
    var g=layoutGroup(map[nm]);
    var dr=-Math.round(((g.minY+g.maxY)/2)/SY), dq=Math.ceil((cursor-g.minX)/SX-dr/2);
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9, conq=0;
    g.out.forEach(function(t){ t.q+=dq; t.r+=dr; var p=hexXY(t.q,t.r); t.x=p.x; t.y=p.y; t.group=nm;
      x0=Math.min(x0,t.x);x1=Math.max(x1,t.x);y0=Math.min(y0,t.y);y1=Math.max(y1,t.y); if(isTaken(t)) conq++; all.push(t); });
    S.groups.push({name:nm,idx:gi,n:g.out.length,conq:conq,minX:x0-HEX,maxX:x1+HEX,minY:y0-HEX,maxY:y1+HEX,col:SQUADCOL[gi%SQUADCOL.length]});
    cursor=x1+HEX*10; gmin=Math.min(gmin,x0); gmax=Math.max(gmax,x1); ymin=Math.min(ymin,y0); ymax=Math.max(ymax,y1);

  S.bounds={minX:gmin-HEX*3,maxX:gmax+HEX*3,minY:ymin-HEX*4,maxY:ymax+HEX*3};
  var baseY=ymin-HEX*21, baseX=(gmin+gmax)/2;

  S.river.forEach(function(r){ r.pts=[]; for(var i=0;i<=56;i++) r.pts.push(riverPt(r,i/56)); });

  S.lands=S.admin?makeLands(gmin,gmax,ymin,ymax):[];
  return all;
}

/* ---------- игровая логика: опыт, серия, хроника ---------- */
var DAILY_GOAL=3;
var XPS={'Новый':0,'В работе':10,'Не дозвонился':3,'Активен (сделал заказ)':50,'Передан в дивизион':80,'Отказ':2,'Конечный заказчик':50};
var RANKS=['Новобранец','Сержант','Лейтенант','Капитан','Майор','Полковник','Генерал','Маршал'];
function localDay(v){ var d=(v instanceof Date)?v:new Date(v); if(isNaN(d)) return null; var m=d.getMonth()+1,dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function computeGame(){
  var act={}, xp=0, evs=[], me=S.me;
  S.tiles.forEach(function(t){
    var c=t.c, seen={};
    (c.statusHistory||[]).forEach(function(h,i){
      if(!h||!h.at) return; var day=localDay(h.at); if(!day) return;
      if(!(i===0&&h.status==='Новый')) evs.push({at:h.at,day:day,by:h.by||'',status:h.status,id:t.id,company:c.company||'—'});
      if(h.by===me&&!(i===0&&h.status==='Новый')){ act[day]=(act[day]||0)+1; xp+=XPS[h.status]||0; seen[day]=1; }
    });
    (c.notes||[]).forEach(function(n){ if(n&&n.by===me&&n.at){ var d=localDay(n.at); if(d){ act[d]=(act[d]||0)+1; xp+=3; seen[d]=1; } } });
    if(c.lastContactDate&&(c.manager===me||c.accountManager===me)&&!seen[c.lastContactDate]){ act[c.lastContactDate]=(act[c.lastContactDate]||0)+1; xp+=5; }
  });
  var today=new Date(), streak=0, dots=[], broken=false, first=true, d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  for(var i=0;i<800;i++,d.setDate(d.getDate()-1)){
    var wd=d.getDay(); if(wd===0||wd===6) continue;
    var k=localDay(d), ok=(act[k]||0)>=DAILY_GOAL;
    if(dots.length<14) dots.push({k:k,ok:ok,n:act[k]||0,today:first});
    if(!broken){ if(ok) streak++; else if(!first) broken=true; }
    first=false;
    if(broken&&dots.length>=14) break;
  }
  var lvl=Math.floor(Math.sqrt(xp/40))+1, cur=40*(lvl-1)*(lvl-1), nxt=40*lvl*lvl;
  evs.sort(function(a,b){return a.at<b.at?1:-1;});
  S.events=evs;
  return {xp:xp,lvl:lvl,rank:RANKS[Math.min(RANKS.length-1,Math.floor((lvl-1)/2))],pct:Math.round((xp-cur)/(nxt-cur)*100),toNext:nxt-xp,streak:streak,dots:dots.reverse(),todayN:act[localDay(today)]||0};
}
function pushCapture(id,delay,label){ S.fx.push({id:id,t0:performance.now()+(delay||0),label:label,shown:false}); }

/* ---------- загрузка данных ---------- */
async function fetchAll(table, cols){
  var from=0, size=1000, all=[];
  while(true){
    var res=await sb.from(table).select(cols).range(from,from+size-1);
    if(res.error) throw res.error;
    all=all.concat(res.data); if(res.data.length<size) break; from+=size;
  }
  return all;
}
async function loadData(){
  if(S.loading) return; S.loading=true; setStatus('Разведчики собирают донесения…');
  try{
    var rows=await fetchAll('clients','id,data');
    var cl=rows.map(function(r){ var c=r.data||{}; c._id=r.id; return c; });
    if(!S.admin) cl=cl.filter(function(c){ return c.manager===S.me||c.accountManager===S.me; });
    var ship=null;
    try{
      var sh=await fetchAll('shipments','period_from,period_to,order_sum,order_count,client_code');
      if(sh.length){
        var latest=sh.reduce(function(a,s){return s.period_from>a?s.period_from:a;},'');
        var per=sh.filter(function(s){return s.period_from===latest;});
        ship={from:latest,to:per[0].period_to,sum:per.reduce(function(a,s){return a+(Number(s.order_sum)||0);},0),orders:per.reduce(function(a,s){return a+(Number(s.order_count)||0);},0),byCode:{}};
        per.forEach(function(s){ ship.byCode[s.client_code]=(ship.byCode[s.client_code]||0)+(Number(s.order_sum)||0); });
      }
    }catch(e){ /* отгрузки не критичны */ }
    S.ship=ship;
    var prevCat=null; if(S.loaded){ prevCat={}; S.tiles.forEach(function(t){prevCat[t.id]=t.cat;}); }
    S.clients=cl;
    S.tiles=layout(cl.map(function(c){
      var sc=score(c); return {id:c._id,c:c,score:sc,seg:seg(sc),cat:catOf(c),days:daysSince(c.lastContactDate),gold:ship&&c.code?(ship.byCode[c.code]||0):0};
    }));
    S.byId={}; S.tiles.forEach(function(t){ S.byId[t.id]=t; });
    var cut7=Date.now()-7*864e5, actv={}; (S.events||[]).forEach(function(e){ if(new Date(e.at).getTime()>=cut7){ var w=e.by||e.manager; actv[w]=(actv[w]||0)+1; } });
    (S.river||[]).forEach(function(r){ r.act=3+Math.min(7,Math.round((actv[r.name]||0)/3)); });
    S.game=computeGame();
    if(prevCat){ S.tiles.forEach(function(t){ if(prevCat[t.id]&&prevCat[t.id]!==t.cat&&(t.cat==='empire'||t.cat==='colony')) pushCapture(t.id,0,t.c.company); }); }
    else { var cut=Date.now()-7*864e5, win=[], seenId={}; S.events.forEach(function(e){ if(seenId[e.id]) return; var tl=S.byId[e.id]; if((e.status==='Активен (сделал заказ)'||e.status==='Передан в дивизион')&&tl&&(tl.cat==='empire'||tl.cat==='colony')){ seenId[e.id]=1; win.push(e); } }); var rec=win.filter(function(e){return new Date(e.at).getTime()>=cut;}); (rec.length?rec:win).slice(0,4).forEach(function(e,n){ pushCapture(e.id,600+n*2600,e.company); }); }
    S.grid={}; S.tiles.forEach(function(t){ S.grid[t.q+','+t.r]=t; });

    console.error(e); setStatus('Не удалось получить донесения: '+(e&&e.message||'ошибка сети'));

   +res('⚔️',by.front,'Войск на фронте','<b>Передовая</b>Клиенты в работе: статусы «В работе» и «Не дозвонился». Это те, с кем идёт активная борьба за первый заказ.')+res('🌫️',fogPct+'%','Земли в тумане','<b>Туман войны</b>Доля клиентов со статусом «Новый», с которыми ещё не начинали работу. Чем меньше тумана, тем лучше разведана база.')+res('📈',conv+'%','Конверсия в заказ','<b>Конверсия</b>Взятые территории, делённые на всех клиентов. Показывает, какая доля базы дошла до заказа.');

function resize(){
  var cv=document.getElementById('hqCanvas'); if(!cv||!S.open) return; var w=cv.parentNode.clientWidth,h=cv.parentNode.clientHeight; if(!w||!h) return;
  var dpr=Math.min(window.devicePixelRatio||1,2); cv.width=w*dpr; cv.height=h*dpr; S.W=w; S.H=h; S.dpr=dpr;
  if(S.ready && !S.fitted) fitCamera();
}
function focusGroup(nm){ var g=(S.groups||[]).filter(function(x){return x.name===nm;})[0]; if(!g||!S.W) return; var w=g.maxX-g.minX+HEX*6, h=g.maxY-g.minY+HEX*8, k=Math.min(S.W/w,S.H/h)*.95; fly={t0:performance.now(),dur:800,from:{x:S.cam.x,y:S.cam.y,k:S.cam.k},to:{k:k,x:S.W/2-(g.minX+g.maxX)/2*k,y:S.H/2-(g.minY+g.maxY)/2*k}}; }
function fitFly(){ if(!S.bounds||!S.W) return; var b=S.bounds, k=Math.min(S.W/(b.maxX-b.minX),S.H/(b.maxY-b.minY))*.96; fly={t0:performance.now(),dur:800,from:{x:S.cam.x,y:S.cam.y,k:S.cam.k},to:{k:k,x:S.W/2-(b.minX+b.maxX)/2*k,y:S.H/2-(b.minY+b.maxY)/2*k}}; }
function fitCamera(){
  if(!S.bounds||!S.W) return; var b=S.bounds, k=Math.min(S.W/(b.maxX-b.minX),S.H/(b.maxY-b.minY))*.96;
  S.cam.k=k; S.cam.x=S.W/2-(b.minX+b.maxX)/2*k; S.cam.y=S.H/2-(b.minY+b.maxY)/2*k; S.fitted=true; S.minK=k*.8;

    ctx.globalAlpha=dim; ctx.font='700 '+fs+'px Philosopher,serif'; ctx.lineWidth=4; ctx.strokeStyle='rgba(5,8,18,.9)'; ctx.fillStyle=g.col;
    var t='ЗЕМЛИ · '+g.name.toUpperCase(); ctx.strokeText(t,px,py); ctx.fillText(t,px,py);
    ctx.font='600 '+Math.max(11,fs*.72)+'px "IBM Plex Sans",sans-serif'; ctx.fillStyle='#e9e4d3'; var t2=g.n+' земель · взято '+g.conq+' · туман '+Math.round((1-0)*0+0)+'';
    t2=g.n+' земель · взято '+g.conq; ctx.strokeText(t2,px,py+fs*1.15); ctx.fillText(t2,px,py+fs*1.15); ctx.globalAlpha=1;
  });
}

/* ---------- жизненный цикл / навигация ---------- */
function openHq(){
  var root=document.getElementById('hqRoot'), main=document.getElementById('main'); if(!root) return;
  S.open=true; root.hidden=false; if(main) main.style.display='none';
  markNav(); setTimeout(function(){ resize(); },0);
  if(!S.loaded) loadData(); else renderHud();
  clearInterval(S.timer); S.timer=setInterval(function(){ if(S.open) loadData(); },90000);
  if(!S.raf) S.raf=requestAnimationFrame(frame);
}
function closeHq(){
  var root=document.getElementById('hqRoot'), main=document.getElementById('main'); S.open=false; if(root) root.hidden=true; if(main) main.style.display=''; clearInterval(S.timer);
  document.getElementById('hqTip')&&document.getElementById('hqTip').classList.remove('show');
}
function markNav(){
  var nav=document.getElementById('navrow'); if(!nav) return; var mine=nav.querySelector('[data-hq]');
  if(!mine){ mine=document.createElement('button'); mine.className='navbtn'; mine.setAttribute('data-hq','1'); mine.textContent=S.admin?'⚔️ Штаб':'🗺️ Моя земля'; mine.style.marginLeft='auto'; nav.appendChild(mine); }
  nav.querySelectorAll('.navbtn').forEach(function(b){ if(b!==mine) { if(S.open) b.classList.remove('active'); } });
  mine.classList.toggle('active',S.open);
}
function startNav(){
  var nav=document.getElementById('navrow');
  nav.addEventListener('click',function(e){
    var b=e.target.closest('.navbtn'); if(!b) return;
    if(b.hasAttribute('data-hq')){ e.stopPropagation(); S.open?null:openHq(); return; }
    if(S.open) closeHq();
  },true);
  new MutationObserver(function(){ if(!S.allowed) return; markNav(); }).observe(nav,{childList:true});
  markNav();
}

async function init(){
  async function check(){
    var r=await sb.auth.getSession(); var ses=r&&r.data&&r.data.session; if(!ses||!ses.user||S.allowed) return;
    var m=null; try{ var q=await sb.from('managers').select('display_name,role').eq('email',ses.user.email).maybeSingle(); m=q&&q.data; }catch(e){}
    if(!m||!m.display_name) return;
    S.allowed=true; S.me=m.display_name; S.admin=(m.role==='admin'); if(!S.admin) S.scope='mine';
    buildDom(); startNav();
  }
  await check();
  sb.auth.onAuthStateChange(function(){ check(); });
}
window.__hqDebug=S;
init();
})();

</script>
