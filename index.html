<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg:#f5f4ef; --surface:#ffffff; --surface-2:#eeece3; --border:#dfdbcd;
    --text:#211e17; --text-muted:#6d6a5c; --text-faint:#9c9788;
    --accent:#2f6b5e; --accent-strong:#1e453b; --accent-weak:#e2eee9;
    --good:#2c7a4b; --good-weak:#e2f2e6;
    --warn:#a8721c; --warn-weak:#faf0da;
    --bad:#ad3b34; --bad-weak:#fae6e3;
    --info:#33628c; --info-weak:#e6eef5;
    --violet:#6b4fa0; --violet-weak:#efeaf7;
    --neutral:#8a8676; --neutral-weak:#ecebe2;
    --shadow:0 8px 24px rgba(33,30,23,0.10), 0 1px 3px rgba(33,30,23,0.08);
    --radius:12px; --radius-sm:8px;
    --font-display:'Manrope',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17160f; --surface:#201e16; --surface-2:#2a281e; --border:#3a3728;
      --text:#efece2; --text-muted:#a9a493; --text-faint:#79765f;
      --accent:#5fa892; --accent-strong:#8fd0bb; --accent-weak:#213b34;
      --good:#5fb27f; --good-weak:#1c3527;
      --warn:#d8a44e; --warn-weak:#3a2f16;
      --bad:#e08078; --bad-weak:#3b211e;
      --info:#7ba7cf; --info-weak:#1f2f3d;
      --violet:#b09ad8; --violet-weak:#2c2440;
      --neutral:#a29d8a; --neutral-weak:#2c2a1f;
      --shadow:0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17160f; --surface:#201e16; --surface-2:#2a281e; --border:#3a3728;
    --text:#efece2; --text-muted:#a9a493; --text-faint:#79765f;
    --accent:#5fa892; --accent-strong:#8fd0bb; --accent-weak:#213b34;
    --good:#5fb27f; --good-weak:#1c3527;
    --warn:#d8a44e; --warn-weak:#3a2f16;
    --bad:#e08078; --bad-weak:#3b211e;
    --info:#7ba7cf; --info-weak:#1f2f3d;
    --violet:#b09ad8; --violet-weak:#2c2440;
    --neutral:#a29d8a; --neutral-weak:#2c2a1f;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:var(--font-display); text-wrap:balance;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button,select,input,textarea{font:inherit; color:inherit;}
  ::selection{background:var(--accent-weak);}

  a{color:var(--accent-strong);}

  /* ---------- layout shell ---------- */
  #app{min-height:100%; display:flex; flex-direction:column;}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px clamp(16px,3vw,32px);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand .mark{
    width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;flex:none;
  }
  .brand h1{font-size:17px; font-weight:800; margin:0; letter-spacing:-0.01em;}
  .brand .sub{font-size:12px; color:var(--text-muted);}

  .whoami{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);}
  .whoami select{
    padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  }

  .navrow{
    display:flex; gap:6px; padding:10px clamp(16px,3vw,32px) 0; flex-wrap:wrap;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .navbtn{
    appearance:none; border:1px solid transparent; background:transparent; color:var(--text-muted);
    padding:9px 14px; border-radius:var(--radius-sm) var(--radius-sm) 0 0; cursor:pointer; font-size:13.5px; font-weight:600;
    border-bottom:2px solid transparent; transition:color .15s;
  }
  .navbtn:hover{color:var(--text);}
  .navbtn.active{color:var(--accent-strong); border-bottom:2px solid var(--accent);}
  .navbtn .count{color:var(--text-faint); font-weight:500; margin-left:4px;}
  .navbtn.active .count{color:var(--accent-strong);}

  main{flex:1; padding:20px clamp(16px,3vw,32px) 48px; display:flex; flex-direction:column; gap:16px; max-width:1600px; width:100%; margin:0 auto;}

  /* ---------- summary strip ---------- */
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 14px; display:flex; align-items:baseline; gap:8px; min-width:0;
  }
  .stat b{font-family:var(--font-display); font-size:17px;}
  .stat span{font-size:12px; color:var(--text-muted);}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=text], .toolbar select{
    padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px;
  }
  .toolbar input[type=text]{min-width:220px; flex:1 1 220px;}
  .chipgroup{display:flex; gap:6px; flex-wrap:wrap;}
  .daterange{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .daterange input[type=date]{padding:9px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px;}
  .chip{
    border:1px solid var(--border); background:var(--surface); padding:7px 12px; border-radius:999px; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--text-muted);
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn{
    appearance:none; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:10px 16px;
    border-radius:var(--radius-sm); cursor:pointer; font-weight:700; font-size:13.5px; white-space:nowrap;
  }
  .btn:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.ghost{background:transparent; color:var(--accent-strong);}
  .btn.subtle{background:var(--surface-2); border-color:var(--border); color:var(--text);}
  .btn.danger{background:var(--bad); border-color:var(--bad);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.sm{padding:6px 11px; font-size:12.5px;}

  /* ---------- table ---------- */
  .tablewrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .tscroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:920px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);
    padding:8px 10px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; font-weight:600;
  }
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{color:var(--accent-strong);}
  thead th.sortable.sorted{color:var(--accent-strong);}
  /* Столбцы, где раньше именно длинный ЗАГОЛОВОК (не сами данные) раздувал ширину
     таблицы — заголовку разрешаем перенос на две строки вместо растягивания колонки. */
  th.col-accountmgr, th.col-revenue, th.col-regdate, th.col-lastcontact{white-space:normal;}
  th.col-accountmgr, td.col-accountmgr{max-width:100px;}
  th.col-revenue, td.col-revenue{max-width:92px;}
  td.col-revenue{font-size:12px; overflow-wrap:break-word; word-break:break-word;}
  th.col-regdate, td.col-regdate{max-width:86px;}
  th.col-lastcontact, td.col-lastcontact{max-width:96px;}
  td.col-lastcontact .pill{white-space:normal; text-align:center;}
  /* Статус — самая широкая колонка была из-за плашки статуса в одну строку;
     разрешаем ей перенос на две строки только внутри списка клиентов. */
  td.col-status{max-width:104px;}
  td.col-status .pill{white-space:normal; text-align:center;}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13.5px;}
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:var(--accent-weak);}
  tbody tr:last-child td{border-bottom:none;}
  .company{font-weight:600;}
  .code{color:var(--text-faint); font-size:11.5px;}
  .muted{color:var(--text-muted);}
  .warnflag{color:var(--warn); font-size:11px; font-weight:700;}
  .copybtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; margin-left:4px; padding:0; border:none; border-radius:5px;
    background:transparent; color:var(--text-faint); font-size:12px; line-height:1; cursor:pointer;
    vertical-align:middle;
  }
  .copybtn:hover{background:var(--neutral-weak); color:var(--text);}

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
    white-space:nowrap;
  }
  .pill.good{background:var(--good-weak); color:var(--good);}
  .pill.warn{background:var(--warn-weak); color:var(--warn);}
  .pill.bad{background:var(--bad-weak); color:var(--bad);}
  .pill.info{background:var(--info-weak); color:var(--info);}
  .pill.violet{background:var(--violet-weak); color:var(--violet);}
  .pill.neutral{background:var(--neutral-weak); color:var(--neutral);}

  .loadmore{padding:14px; text-align:center;}
  .empty{padding:48px 20px; text-align:center; color:var(--text-muted);}

  /* ---------- kpi view ---------- */
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
  .kpi-card h2{font-size:15px; margin:0 0 12px;}
  table.kpi{width:100%; border-collapse:collapse; font-size:13px;}
  table.kpi th, table.kpi td{padding:8px 10px; border-bottom:1px solid var(--border); text-align:right;}
  table.kpi th:first-child, table.kpi td:first-child{text-align:left; font-weight:600;}
  table.kpi thead th{color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  table.kpi tfoot td{font-weight:700; border-top:2px solid var(--border); border-bottom:none;}
  .grouphead{background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700;}

  /* ---------- KPI charts ---------- */
  .kpi-charts-grid{display:flex; gap:16px; flex-wrap:wrap; margin-top:16px;}
  .chart-card{flex:1 1 360px; min-width:0; max-width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 14px 10px;}
  .chart-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .chart-card-head h3{margin:0; font-size:13px; font-weight:700; color:var(--text);}
  .chart-card-wrap{position:relative;}
  .kpi-chart-svg{width:100%; height:auto; display:block; overflow:visible;}
  .kpi-bar-hit{cursor:pointer;}
  .kpi-bar-g .kpi-bar-rect{transition:opacity .1s;}
  .kpi-bar-g:hover .kpi-bar-rect, .kpi-bar-g:focus .kpi-bar-rect, .kpi-bar-g.hover .kpi-bar-rect{opacity:.75;}
  .kpi-bar-g{outline:none;}
  .kpi-bar-g:focus .kpi-bar-hit{outline:2px solid var(--accent); outline-offset:-2px;}
  .kpi-tooltip{
    position:fixed; z-index:70; pointer-events:none; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:7px 10px; font-size:12px; box-shadow:var(--shadow); opacity:0; transition:opacity .08s;
    max-width:220px;
  }
  .kpi-tooltip.show{opacity:1;}
  .kpi-tooltip .tt-label{color:var(--text-muted); margin-bottom:2px;}
  .kpi-tooltip .tt-value{color:var(--text); font-weight:700;}
  .chart-table-toggle{background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; cursor:pointer;}
  .chart-table-toggle:hover{color:var(--text); border-color:var(--text-faint);}
  .chart-table{display:none; width:100%; max-width:100%; min-width:0; table-layout:fixed; border-collapse:collapse; font-size:12px; margin-top:8px;}
  .chart-table.show{display:table;}
  .chart-table.show + .chart-card-wrap{display:none;}
  .chart-table th, .chart-table td{padding:6px 8px; border-bottom:1px solid var(--border); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chart-table th:first-child, .chart-table td:first-child{text-align:left; font-weight:600;}
  .chart-table thead th{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .chart-empty{font-size:12.5px; color:var(--text-faint); padding:20px 0; text-align:center;}

  /* ---------- drawer ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(20,18,12,0.4); backdrop-filter:blur(1px); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .backdrop.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(560px,100%); background:var(--surface); z-index:41;
    box-shadow:var(--shadow); transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:12px;
  }
  .drawer-head h2{margin:0; font-size:16px;}
  .drawer-head .meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .drawer-body{flex:1; overflow-y:auto; padding:16px 20px 24px; display:flex; flex-direction:column; gap:22px;}
  .drawer-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center;}

  .section-title{
    font-family:var(--font-display); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-strong);
    font-weight:800; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .field-grid .full{grid-column:1/-1;}
  label.lbl{display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; font-weight:600;}
  .field-grid input[type=text], .field-grid input[type=date], .field-grid input[type=number], .field-grid select, .field-grid textarea{
    width:100%; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;
  }
  .field-grid textarea{resize:vertical; min-height:52px; font-family:inherit;}

  /* ---------- contacts list (client card) ---------- */
  .contacts-list{display:flex; flex-direction:column; gap:10px;}
  .contact-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; display:flex; flex-direction:column; gap:10px; position:relative;
  }
  .contact-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .contact-card-head .who{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); font-weight:600;}
  .contact-remove{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; padding:0; border:none; border-radius:6px;
    background:transparent; color:var(--text-faint); font-size:15px; line-height:1; cursor:pointer;
  }
  .contact-remove:hover{background:var(--bad-weak); color:var(--bad);}
  .contact-card .field-grid{gap:8px 10px;}
  .contact-card input[type=text]{background:var(--surface);}
  .add-contact-btn{
    align-self:flex-start; background:transparent; border:1px dashed var(--border); color:var(--accent-strong);
    padding:9px 14px; border-radius:var(--radius-sm); cursor:pointer; font-weight:700; font-size:13px;
  }
  .add-contact-btn:hover{border-color:var(--accent); background:var(--accent-weak);}
  .primary-star{color:var(--warn); font-size:13px;}

  /* ---------- notes feed (client card) ---------- */
  .notes-feed{display:flex; flex-direction:column; gap:10px;}
  .notes-add{display:flex; flex-direction:column; gap:6px;}
  .notes-add textarea{
    width:100%; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13.5px; font-family:inherit; resize:vertical; min-height:44px;
  }
  .notes-add .btn{align-self:flex-start;}
  .notes-list{display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;}
  .note-item{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px;}
  .note-item-head{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--text-faint); margin-bottom:4px;}
  .note-item .note-by{font-weight:600; color:var(--text-muted);}
  .note-text{font-size:13px; white-space:pre-wrap; word-break:break-word;}

  .checkline{display:flex; align-items:flex-start; gap:8px; font-size:13px; padding:6px 0;}
  .checkline input{margin-top:3px; flex:none;}
  .banner{
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;
  }
  .banner.warn{background:var(--warn-weak); color:var(--warn);}
  .banner.good{background:var(--good-weak); color:var(--good);}
  .scoreblock{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; display:flex; flex-direction:column; gap:10px;
    transition:opacity .15s;
  }
  .scoreblock.disabled{opacity:.4; pointer-events:none;}
  .scorerow{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--text-muted);}
  .scorerow b{color:var(--text); font-family:var(--font-mono); font-size:13px;}
  .totalscore{
    display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--border);
  }
  .totalscore .num{font-family:var(--font-display); font-size:28px; font-weight:800;}
  .readonlybadges{display:flex; gap:8px; flex-wrap:wrap;}
  .helptext{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  details.legend{font-size:12.5px; color:var(--text-muted);}
  details.legend summary{cursor:pointer; font-weight:600; color:var(--accent-strong);}
  details.legend table{width:100%; margin-top:8px; border-collapse:collapse;}
  details.legend td{padding:3px 6px; border-bottom:1px dashed var(--border);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; box-shadow:var(--shadow);
  }

  .center-msg{margin:60px auto; max-width:420px; text-align:center; color:var(--text-muted); font-size:13.5px;}

  @media (max-width:640px){
    .field-grid{grid-template-columns:1fr;}
    table{min-width:760px;}
  }

  /* ---------- login screen ---------- */
  .login-wrap{
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:32px; width:100%; max-width:360px;
  }
  .login-card .mark{
    width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:18px;margin-bottom:14px;
  }
  .login-card h1{font-size:18px; margin:0 0 4px;}
  .login-card .sub{font-size:12.5px; color:var(--text-muted); margin-bottom:20px;}
  .login-card label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin:14px 0 6px;}
  .login-card input{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px;
  }
  .login-card button{

function safeLogExtra(extra){
  try{
    if (extra instanceof Error) return { name: extra.name, message: extra.message, stack: extra.stack };

function monthsBetween(fromISO, toDate){
  if(!fromISO) return null;
  const from = new Date(fromISO+"T00:00:00");
  if (isNaN(from.getTime())) return null;
  let months = (toDate.getFullYear()-from.getFullYear())*12 + (toDate.getMonth()-from.getMonth());
  if (toDate.getDate() < from.getDate()) months -= 1;
  return Math.max(0, months);
}
function addMonthsISO(fromISO, n){
  if(!fromISO) return null;
  const d = new Date(fromISO+"T00:00:00");
  if (isNaN(d.getTime())) return null;
  const day = d.getDate();
  d.setMonth(d.getMonth()+n);
  if (d.getDate() !== day) d.setDate(0); // конец короче — откатываемся на последний день предыдущего месяца
  return d.toISOString().slice(0,10);
}
function commissionInfo(c){
  // Комиссия менеджеру: 3 месяца после передачи клиента в дивизион (только для статуса «Передан в дивизион»)
  if (c.status!=="Передан в дивизион") return null;
  if (!c.transferDate) return {transferDate:null, until:null, active:null};
  const until = addMonthsISO(c.transferDate, 3);
  const active = until >= todayISO();
  return {transferDate:c.transferDate, until, active};
}

function uid(){ return "m"+Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return "—"; return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtMoney(v){
  if(v==null || v==="" || isNaN(v)) return "—";
  // toLocaleString расставляет неразрывные пробелы между разрядами — в узкой колонке
  // такое число не переносится и наезжает на соседний столбец. Меняем на обычные
  // пробелы, чтобы длинная сумма переносилась по разрядам, как обычный текст.
  return Math.round(Number(v)).toLocaleString("ru-RU").replace(/ /g," ")+" ₽";
}
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function daysSince(iso){ if(!iso) return null; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null; const ms = new Date(todayISO()+"T00:00:00") - d; return Math.round(ms/86400000); }
function noContactBadge(lastContactDateIso){
  const days = daysSince(lastContactDateIso);
  if (days==null) return `<span class="pill warn">не было контакта</span>`;
  let style, label;
  if (days>=150){ style="bad"; label="150+ дней"; }
  else if (days>=100){ style="bad"; label="100+ дней"; }
  else if (days>=30){ style="warn"; label="30+ дней"; }
  else if (days>=5){ style="info"; label=days+" дн."; }
  else { style="good"; label = days<=0 ? "сегодня" : days+" дн."; }
  return `<span>${fmtDate(lastContactDateIso)}</span> <span class="pill ${style}">${label}</span>`;
}

/* =====================================================================
   DUPLICATE DETECTION — предупреждение при похожем клиенте
   ===================================================================== */
function asStr(s){
  // защита от нестроковых значений в старых/импортированных данных
  // (например, телефон, попавший в базу как число, а не строка)
  return (s==null) ? "" : String(s);
}
function normCompanyName(s){
  return asStr(s).toLowerCase()
    .replace(/[«»"'.,()]/g, "")
    .replace(/\b(ооо|зао|оао|пао|нко|ип)\b/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function normPhoneDigits(s){
  const digits = asStr(s).replace(/\D/g, "");
  return digits ? digits.slice(-10) : "";
}
function normEmailStr(s){
  return asStr(s).trim().toLowerCase();
}
function findPossibleDuplicates(draft, excludeId){
  const company = normCompanyName(draft.company);
  const phone = normPhoneDigits(draft.phone);
  const email = normEmailStr(draft.email);
  const matches = [];
  clients.forEach((c, id)=>{
    if (id===excludeId) return;
    let reason = null;
    if (company && normCompanyName(c.company)===company) reason = "по названию компании";
    else if (phone && normPhoneDigits(c.phone)===phone) reason = "по телефону";
    else if (email && normEmailStr(c.email)===email) reason = "по email";
    if (reason) matches.push({ id, c, reason });
  });
  return matches;
}

async function copyToClipboard(text){
  if (!text){ return; }
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast("Скопировано: "+text);
  }catch(e){
    toast("Не удалось скопировать");
  }
}
function copyBtnHtml(text){
  if (!text) return "";
  return `<button type="button" class="copybtn" data-copy="${esc(text)}" title="Скопировать название">⧉</button>`;
}

  root.querySelectorAll(".copybtn").forEach(b=>{

  });
}

/* =====================================================================
   DB — тонкая обёртка над Supabase, повторяющая интерфейс db.collection/doc
   ===================================================================== */
function makeSupabaseDb(){
  let cache = new Map();
  let listeners = new Set();
  let channel = null;
  let loaded = false;

  function snapshotFromCache(){
    return { docs: Array.from(cache.entries()).map(([id,data])=>({ id, exists:true, data:()=>data })) };
  }
  function notify(){
    const snap = snapshotFromCache();
    listeners.forEach(cb=>{ try{ cb(snap); }catch(e){ console.error(e); } });
  }
  async function loadAll(){
    let from = 0;
    const pageSize = 1000;
    const next = new Map();
    while(true){
      const { data, error } = await supabase.from("clients").select("id,data").range(from, from+pageSize-1);
      if (error) throw error;
      data.forEach(r=> next.set(r.id, r.data));
      if (data.length < pageSize) break;
      from += pageSize;
    }
    cache = next;
    loaded = true;
  }
  function ensureRealtime(){
    if (channel) return;
    channel = supabase.channel("clients-changes")
      .on("postgres_changes", { event:"*", schema:"public", table:"clients" }, payload=>{
        if (payload.eventType === "DELETE"){
          if (payload.old && payload.old.id) cache.delete(payload.old.id);
        } else if (payload.new){
          cache.set(payload.new.id, payload.new.data);
        }
        notify();
      })
      .subscribe(status=>{
        if (status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED"){
          logEvent("realtime", "Статус канала обновлений: "+status+" — переподключение через 3с");
          const broken = channel;
          channel = null;
          try{
            // removeChannel() зовёт unsubscribe(), который возвращает Promise —
            // в момент обрыва канал уже в процессе внутренней очистки, и эта
            // проверка иногда отклоняется асинхронно. Гасим и синхронный throw,
            // и асинхронный reject, чтобы это не улетало в unhandledrejection.
            const p = supabase.removeChannel(broken);
            if (p && typeof p.catch === "function") p.catch(()=>{});
          }catch(e){}
          setTimeout(ensureRealtime, 3000);
        } else if (status==="SUBSCRIBED"){
          logEvent("realtime", "Канал обновлений подключён");
        }
      });
  }
  return {
    collection(name){
      return {
        onSnapshot(cb, errCb){
          listeners.add(cb);
          (loaded ? Promise.resolve() : loadAll()).then(()=>{
            ensureRealtime();
            notify();
          }).catch(e=>{ if (errCb) errCb(e); else console.error(e); });
          return ()=>{ listeners.delete(cb); };
        },
        async add(data){
          const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("id-"+Date.now()+"-"+Math.random().toString(36).slice(2));
          const { error } = await supabase.from("clients").insert({ id, data });
          if (error) throw error;
          // обновляем локальный кэш сразу — не полагаемся только на realtime-канал
          // (если он в этот момент разорван, интерфейс всё равно должен обновиться)
          cache.set(id, data);
          notify();
          return { id };
        },
      };
    },
    doc(path){
      const id = path.split("/")[1];
      return {
        async update(patch){
          const current = cache.get(id) || {};
          const merged = Object.assign({}, current, patch);
          const { error } = await supabase.from("clients").update({ data: merged }).eq("id", id);
          if (error) throw error;
          cache.set(id, merged);
          notify();
        },
        async set(data){
          const { error } = await supabase.from("clients").upsert({ id, data });
          if (error) throw error;
          cache.set(id, data);
          notify();
        },
        async delete(){
          const { error } = await supabase.from("clients").delete().eq("id", id);
          if (error) throw error;
          cache.delete(id);
          notify();
        },
      };
    },
  };
}

function normalizeClient(data){
  // старые карточки хранят одно контактное лицо в contactPerson/email/phone —
  // приводим их к массиву contacts, ничего не удаляя (эти поля остаются как
  // "зеркало" первого/основного контакта для старого кода — экспорт, поиск дублей и т.д.)
  if (!data) return data;
  if (!Array.isArray(data.contacts) || data.contacts.length===0){
    if (data.contactPerson || data.email || data.phone){
      data.contacts = [{ name: data.contactPerson||"", role:"", email: data.email||"", phone: data.phone||"" }];
    } else {
      data.contacts = [];
    }
  }
  if (!Array.isArray(data.changeLog)) data.changeLog = [];
  if (data.accountManager==null) data.accountManager = "";
  // старые карточки хранят единственное поле "следующий шаг" — переносим его
  // в ленту заметок одной первой записью, чтобы не потерять то, что уже написано
  if (!Array.isArray(data.notes)) data.notes = [];
  if (data.notes.length===0 && data.nextStep){
    data.notes = [{ text: data.nextStep, at: data.updatedAt || data.createdAt || nowISO(), by: data.updatedBy || "" }];
  }
  return data;
}
function syncPrimaryContactMirror(draft){
  const c0 = (draft.contacts && draft.contacts[0]) || {};
  draft.contactPerson = c0.name || "";
  draft.email = c0.email || "";
  draft.phone = c0.phone || "";
}
function extraContactsText(c){
  // все контакты, кроме основного (первого) — для выгрузок в Excel
  const list = (c.contacts||[]).slice(1);
  if (!list.length) return "";
  return list.map(ct=>{
    const parts = [ct.name||"", ct.role?("("+ct.role+")"):"", ct.email||"", ct.phone||""].filter(Boolean);
    return parts.join(", ");
  }).join("; ");
}
// Короткая читаемая сводка по списку контактов — для сравнения "было/стало" в истории изменений
function contactsSummary(contacts){
  if (!contacts || !contacts.length) return "—";
  return contacts.map(ct=> ct.name || ct.email || ct.phone || "(без имени)").join("; ");
}
// Сумма/кол-во отгрузок клиента — суммируем по всем загруженным периодам
// вкладки «Отгрузки» (таблица shipments), сопоставляя по коду клиента (1С).
function clientShipmentTotal(c){
  if (!c.code) return {sum:0, count:0};
  let sum=0, count=0;
  shipments.forEach(s=>{
    if (s.client_code===c.code){ sum += Number(s.order_sum)||0; count += Number(s.order_count)||0; }
  });
  return {sum, count};
}

async function initDb(){
  db = makeSupabaseDb();
  unsub = db.collection("clients").onSnapshot(snap=>{
    clients.clear();
    snap.docs.forEach(d=>{ if(d.exists) clients.set(d.id, normalizeClient(d.data())); });
    renderShell();
  }, err=>{
    console.error("db error", err);
    renderCenterMessage("Ошибка синхронизации базы (" + (err&&err.message||"unknown") + "). Обновите страницу.");
  });
  loadShipments();
  ensureShipmentsRealtime();
}

let shipmentsChannel = null;
async function loadShipments(){
  try{
    let from = 0;
    const pageSize = 1000;
    const all = [];
    while(true){
      const { data, error } = await supabase.from("shipments").select("*").range(from, from+pageSize-1);
      if (error) throw error;
      all.push(...data);
      if (data.length < pageSize) break;
      from += pageSize;
    }
    shipments = all;
    shipmentsLoaded = true;
    if (view==="shipments") renderMain();
  }catch(e){
    console.error("shipments load error", e);
    logEvent("shipments-error", "Не удалось загрузить отгрузки: "+(e&&e.message||"unknown"));
  }
}
function ensureShipmentsRealtime(){
  if (shipmentsChannel) return;
  shipmentsChannel = supabase.channel("shipments-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"shipments" }, ()=>{ loadShipments(); })
    .subscribe(status=>{
      if (status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED"){
        const broken = shipmentsChannel;
        shipmentsChannel = null;
        try{
          const p = supabase.removeChannel(broken);
          if (p && typeof p.catch === "function") p.catch(()=>{});
        }catch(e){}
        setTimeout(ensureShipmentsRealtime, 3000);
      }
    });
}

function codeCounts(){
  const m = new Map();
  clients.forEach(c=>{ if(c.code){ m.set(c.code,(m.get(c.code)||0)+1); } });
  return m;
}
function tabLabel(c){
  if (c.tab==="dormant") return "Спящий";
  if (c.source==="incoming") return "Входящая заявка";
  if (c.source==="outgoing") return "Исходящий";
  return "Входящие/исходящие";
}
function matchesFilters(c, opts){
  opts = opts || {};
  if (tabFilter!=="all" && c.tab!==tabFilter) return false;
  if (filters.manager!=="all" && c.manager!==filters.manager) return false;
  if (filters.accountManager!=="all" && (c.accountManager||"")!==filters.accountManager) return false;
  if (!opts.skipStatus && filters.status!=="all" && c.status!==filters.status) return false;
  if (filters.industry!=="all" && (c.industry||"")!==filters.industry) return false;
  if (filters.segment!=="all"){
    const s = computeScores(c);
    if (!s.segment || s.segment.code!==filters.segment) return false;
  }
  if (filters.search){
    const q = filters.search.toLowerCase();
    const contactsHay = (c.contacts||[]).map(ct=>(ct.name||"")+" "+(ct.email||"")+" "+(ct.phone||"")).join(" ");
    const hay = ((c.company||"")+" "+(c.code||"")+" "+(c.contactPerson||"")+" "+(c.region||"")+" "+(c.email||"")+" "+(c.manager||"")+" "+contactsHay).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (filters.regDateFrom || filters.regDateTo){
    if (!c.registrationDate) return false;
    if (filters.regDateFrom && c.registrationDate < filters.regDateFrom) return false;
    if (filters.regDateTo && c.registrationDate > filters.regDateTo) return false;
  }
  return true;
}

function renderNav(){
  const all = Array.from(clients.values());
  const nDormant = all.filter(c=>c.tab==="dormant").length;
  const nFlow = all.filter(c=>c.tab==="flow").length;
  const nAll = all.length;
  const nTransfer = all.filter(c=>computeScores(c).readyForTransfer).length;
  const nTransferred = all.filter(c=>c.status==="Передан в дивизион").length;
  const tabs = [
    {key:"dormant", label:"Спящие клиенты", count:nDormant, view:"list"},
    {key:"flow", label:"Входящие и исходящие", count:nFlow, view:"list"},
    {key:"all", label:"Все клиенты", count:nAll, view:"list"},
    {key:"transfer", label:"Передача в дивизион", count:nTransfer, view:"transfer"},
    {key:"transferred", label:"Переданные (комиссия)", count:nTransferred, view:"transferred"},
    {key:"shipments", label:"Отгрузки", count:null, view:"shipments"},
    {key:"kpi", label:"Дашборд KPI", count:null, view:"kpi"},
  ];
  if (isOwnerUser()) tabs.push({key:"activity", label:"Активность менеджеров", count:null, view:"activity"});
  const nav = document.getElementById("navrow");
  nav.innerHTML = tabs.map(t=>{
    const active = (t.view==="list" && view==="list" && tabFilter===t.key) || (t.view!=="list" && view===t.view);
    return '<button class="navbtn'+(active?" active":"")+'" data-nav="'+t.key+'">'+esc(t.label)+
      (t.count!=null?' <span class="count">'+t.count+'</span>':'')+'</button>';
  }).join("");
  nav.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.getAttribute("data-nav");
      const t = tabs.find(x=>x.key===key);
      logEvent("nav", "Переход на вкладку: "+t.label);
      view = t.view;
      if (t.view==="list") tabFilter = key;
      visibleLimit = 80;
      renderMain();
      renderNav();
    });
  });
}

      <td class="muted col-regdate">${fmtDate(c.registrationDate)}</td>
      <td class="muted col-lastcontact">${noContactBadge(c.lastContactDate)}</td>
    </tr>`;
  }).join("");

  const tableHtml = filtered.length===0 ? `<div class="empty">Ничего не найдено по текущим фильтрам.</div>` : `
    <div class="tablewrap">
      <div class="tscroll">
      <table>
        <thead><tr>
          ${SORT_COLUMNS.map(col=>{
            const active = sortCol===col.key;
            const arrow = active ? (sortDir==="asc" ? " ▲" : " ▼") : "";
            const narrowClass = NARROW_LIST_COLS[col.key] || "";
            const narrow = narrowClass ? " "+narrowClass : "";

  document.getElementById("fSearch").oninput = (e)=>{ filters.search=e.target.value; visibleLimit=80; renderList(); };

function openNewClientFlow(){
  // Всегда явно спрашиваем, в какую вкладку добавить — независимо от того,
  // какая вкладка сейчас открыта у менеджера.
  const backdropEl = document.getElementById("tcmBackdrop");
  backdropEl.hidden = false;
  const close = ()=>{ backdropEl.hidden = true; };
  document.getElementById("tcmFlow").onclick = ()=>{ close(); openDrawer(null, "flow"); };
  document.getElementById("tcmDormant").onclick = ()=>{ close(); openDrawer(null, "dormant"); };
  document.getElementById("tcmCancel").onclick = close;
  backdropEl.onclick = (e)=>{ if (e.target===backdropEl) close(); };
}

async function bulkTransferSelected(){
  if (!db){ toast("База данных недоступна"); return; }
  const ids = Array.from(transferSelected);
  if (ids.length===0) return;
  const dateVal = bulkTransferDate || todayISO();
  const manager = currentManager() || "";
  const btn = document.getElementById("btnBulkTransfer");
  if (btn){ btn.disabled = true; btn.textContent = "Переводим…"; }
  let okCount = 0, failCount = 0;
  await Promise.all(ids.map(async (id)=>{
    try{
      const c = clients.get(id);
      if (!c) return;
      const history = Array.isArray(c.statusHistory) ? c.statusHistory.slice() : [];
      history.push({status:"Передан в дивизион", at: nowISO(), by: manager});
      await db.doc("clients/"+id).update({
        status: "Передан в дивизион",
        transferDate: dateVal,
        statusHistory: history,
        updatedAt: nowISO(),
        updatedBy: manager,
      });
      okCount++;
    }catch(e){
      console.error(e);
      failCount++;
    }
  }));
  transferSelected.clear();
  toast(failCount===0 ? `Передано в дивизион: ${okCount}` : `Передано: ${okCount}, ошибок: ${failCount}`);
  renderTransfer();
}

   TRANSFERRED VIEW — переданные клиенты и окно комиссии менеджеру

function renderTransferred(){
  const main = document.getElementById("main");
  const transferred = Array.from(clients.entries()).filter(([,c])=>c.status==="Передан в дивизион");
  const withInfo = transferred.map(([id,c])=>({id,c,ci:commissionInfo(c)}));
  withInfo.sort((a,b)=>{
    // без даты передачи — наверх (требует внимания), затем по сроку окончания комиссии (скоро истекающие выше)
    if (!a.ci.transferDate && !b.ci.transferDate) return 0;
    if (!a.ci.transferDate) return -1;
    if (!b.ci.transferDate) return 1;
    return a.ci.until.localeCompare(b.ci.until);
  });

  const industries = Array.from(new Set(withInfo.map(x=>x.c.industry).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ru"));
  if (transferredIndustryFilter!=="all" && !industries.includes(transferredIndustryFilter)) transferredIndustryFilter = "all";
  const filteredInfo = transferredIndustryFilter==="all" ? withInfo : withInfo.filter(x=>x.c.industry===transferredIndustryFilter);

  const nActive = filteredInfo.filter(x=>x.ci.active).length;
  const nExpired = filteredInfo.filter(x=>x.ci.transferDate && !x.ci.active).length;
  const nNoDate = filteredInfo.filter(x=>!x.ci.transferDate).length;

  const intro = `<div class="banner ${nNoDate>0?"warn":"good"}" style="align-items:flex-start;">
    <div>
      <b>Переданные клиенты — процент менеджеру 3 месяца после передачи:</b>
      ${nActive} ещё в окне начисления, ${nExpired} — срок истёк${nNoDate>0?`, у ${nNoDate} не указана дата передачи (откройте карточку и заполните)`:""}.
    </div>
  </div>`;

  const toolbarHtml = industries.length===0 ? "" : `
    <div class="toolbar" style="margin-top:10px;">
      <select id="fTransferredIndustry">
        <option value="all">Все отрасли</option>
        ${industries.map(i=>`<option value="${esc(i)}" ${transferredIndustryFilter===i?"selected":""}>${esc(i)}</option>`).join("")}
      </select>
    </div>`;

  const block = filteredInfo.length===0 ? `<div class="empty">${withInfo.length===0?"Пока нет переданных клиентов.":"Ничего не найдено по текущему фильтру."}</div>` : (()=>{
    const rows = filteredInfo.map(({id,c,ci})=>{
      let statusCell;
      if (!ci.transferDate) statusCell = `<span class="pill warn">дата не указана</span>`;
      else statusCell = ci.active ? `<span class="pill good">активна до ${fmtDate(ci.until)}</span>` : `<span class="pill neutral">истекла ${fmtDate(ci.until)}</span>`;
      return `<tr data-id="${esc(id)}">
        <td class="mono">${esc(c.code||"—")}</td>
        <td><div class="company">${esc(c.company)}${copyBtnHtml(c.company)}</div></td>
        <td class="muted">${esc(c.manager||"—")}</td>
        <td class="muted">${esc(c.industry||"—")}</td>
        <td class="muted">${esc(c.region||"—")}</td>
        <td class="muted">${fmtDate(ci.transferDate)}</td>
        <td>${statusCell}</td>
      </tr>`;
    }).join("");
    return `<div class="tablewrap"><div class="tscroll">
      <table>
        <thead><tr><th>Код</th><th>Компания</th><th>Менеджер</th><th>Отрасль</th><th>Регион</th><th>Дата передачи</th><th>Комиссия менеджеру</th></tr></thead>
        <tbody>${rows}</tbody>

  })();

  main.innerHTML = intro + toolbarHtml + block;
  main.querySelectorAll("tbody tr").forEach(tr=> tr.onclick = ()=>openDrawer(tr.getAttribute("data-id")));
  wireCopyButtons(main);

/* =====================================================================
   SHIPMENTS VIEW — отгрузки по клиентам за период (импортируются периодически)
   ===================================================================== */
function shipmentPeriods(){
  const map = new Map(); // key -> {from,to}
  shipments.forEach(s=>{
    const key = s.period_from+"|"+s.period_to;
    if (!map.has(key)) map.set(key, {key, from:s.period_from, to:s.period_to});
  });
  return Array.from(map.values()).sort((a,b)=> b.from.localeCompare(a.from));
}
function findClientIdByCode(code){
  if (!code) return null;
  for (const [id,c] of clients.entries()){ if (c.code===code) return id; }
  return null;
}
// Дивизион/отрасль показываем ЖИВЫМИ из карточки клиента (а не тем, что было
// на момент импорта отгрузок) — если менеджер поменял отрасль в карточке,
// вкладка «Отгрузки» должна сразу отражать актуальный Стандарт/Нестандарт.
function shipmentLiveInfo(s){
  const clientId = findClientIdByCode(s.client_code);
  if (clientId){
    const c = clients.get(clientId);
    return { clientId, industry: c.industry || null, division: computeScores(c).division };
  }
  return { clientId: null, industry: s.industry, division: s.division };
}
function shipmentSortValue(s, col){
  switch(col){
    case "company": return s.company || null;
    case "manager": return s.manager || null;
    case "division": return s.division || null;
    case "order_count": return s.order_count;
    case "order_sum": return s.order_sum;
    default: return null;
  }
}
function renderShipments(){
  const main = document.getElementById("main");

  if (!shipmentsLoaded){
    main.innerHTML = `<div class="empty">Загружаю отгрузки…</div>`;
    return;
  }

  const periods = shipmentPeriods();
  if (periods.length===0){
    main.innerHTML = `<div class="empty">Пока нет ни одного импортированного периода отгрузок. Пришлите список Роману — он передаст мне, я подготовлю импорт.</div>`;
    return;
  }
  if (!shipmentPeriodKey || !periods.find(p=>p.key===shipmentPeriodKey)) shipmentPeriodKey = periods[0].key;

  const scoped = shipments
    .filter(s=> (s.period_from+"|"+s.period_to)===shipmentPeriodKey)
    .map(s=> Object.assign({}, s, shipmentLiveInfo(s)));
  const managersHere = Array.from(new Set(scoped.map(s=>s.manager).filter(Boolean))).sort();
  const scopedByManager = scoped.filter(s=> shipmentManagerFilter==="all" ? true : s.manager===shipmentManagerFilter);
  const industriesHere = Array.from(new Set(scopedByManager.map(s=>s.industry).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ru"));
  if (shipmentIndustryFilter!=="all" && !industriesHere.includes(shipmentIndustryFilter)) shipmentIndustryFilter = "all";
  const filtered = scopedByManager
    .filter(s=> shipmentDivisionFilter==="all" ? true : s.division===shipmentDivisionFilter)
    .filter(s=> shipmentIndustryFilter==="all" ? true : s.industry===shipmentIndustryFilter);
  filtered.sort((a,b)=> compareSortValues(shipmentSortValue(a,shipmentSortCol), shipmentSortValue(b,shipmentSortCol), shipmentSortDir));

  const totalCount = filtered.reduce((sum,s)=> sum+(s.order_count||0), 0);
  const totalSum = filtered.reduce((sum,s)=> sum+(s.order_sum||0), 0);
  const nStandard = scopedByManager.filter(s=>s.division==="Стандарт").length;

    {key:"company", label:"Компания"},

      <td>

/* =====================================================================
   АКТИВНОСТЬ МЕНЕДЖЕРОВ — видно только владельцу (см. OWNER_EMAIL).
   Кто и когда менял статус/отрасль, по каким компаниям — чтобы можно
   было оценить объём отработанного каждым менеджером (включая
   менеджеров ведения, например Веряскину Анну).
   ===================================================================== */
function renderManagerActivity(){
  const main = document.getElementById("main");
  if (!isOwnerUser()){
    main.innerHTML = `<div class="empty">Раздел недоступен.</div>`;
    return;
  }

  const source = Array.from(clients.entries()).map(([id,c])=>Object.assign({id}, c));
  const allRows = computeManagerActivityRows(source);

  if (!activityDateFrom && !activityDateTo){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    activityDateFrom = new Date(y,m,1).toISOString().slice(0,10);
    activityDateTo = new Date(y,m+1,0).toISOString().slice(0,10);
  }

  const inRange = (at)=>{
    if (!at) return false;
    const d = at.slice(0,10);
    if (activityDateFrom && d < activityDateFrom) return false;
    if (activityDateTo && d > activityDateTo) return false;
    return true;
  };
  const scoped = allRows.filter(r=> inRange(r.at));
  const summary = computeManagerActivitySummary(scoped);
  const managersHere = Array.from(new Set(allRows.map(r=>r.manager))).sort((a,b)=>a.localeCompare(b,"ru"));

  const filtered = scoped
    .filter(r=> activityManagerFilter==="all" ? true : r.manager===activityManagerFilter)
    .slice();
  filtered.sort((a,b)=> compareSortValues(activitySortValue(a,activitySortCol), activitySortValue(b,activitySortCol), activitySortDir));

  const toolbarHtml = `
    <div class="toolbar">
      <div class="daterange">
        <span class="helptext" style="white-space:nowrap;">Период:</span>
        <input type="date" id="fActFrom" value="${esc(activityDateFrom)}"/>
        <span class="helptext">—</span>
        <input type="date" id="fActTo" value="${esc(activityDateTo)}"/>
      </div>
      <select id="fActManager">
        <option value="all">Все менеджеры</option>
        ${managersHere.map(m=>`<option value="${esc(m)}" ${activityManagerFilter===m?"selected":""}>${esc(m)}</option>`).join("")}
      </select>
    </div>`;

  const summaryHtml = `
    <div class="kpi-card" style="margin-bottom:16px;">
      <h2>Компаний обработано за период</h2>
      <div class="helptext" style="margin-top:4px;">Компания считается «обработанной», если в выбранный период менеджер поменял по ней статус или отрасль. Одна и та же компания может быть учтена у нескольких менеджеров, если её вели по очереди.</div>
      <div class="stats" style="margin-top:10px;">
        ${summary.length===0 ? `<div class="stat"><b>0</b><span>изменений за период</span></div>` :
          summary.map(s=>`<div class="stat"><b>${s.companies}</b><span>${esc(s.manager)} — компаний (${s.changes} изм.)</span></div>`).join("")}
      </div>
    </div>`;

  const ACT_COLUMNS = [
    {key:"company", label:"Компания"},
    {key:"manager", label:"Менеджер"},
    {key:"field", label:"Что изменил(а)"},
    {key:"change", label:"Было → Стало"},
    {key:"at", label:"Когда"},
  ];
  const rowsHtml = filtered.map(r=>{
    return `<tr ${r.clientId?`data-id="${esc(r.clientId)}"`:""}>
      <td><div class="company">${esc(r.company)}</div><div class="code">${esc(r.code||"без кода")}</div></td>
      <td class="muted">${esc(r.manager)}</td>
      <td>${esc(r.field)}</td>
      <td class="muted">${esc(r.from)} → ${esc(r.to)}</td>
      <td class="muted">${fmtDateTime(r.at)}</td>
    </tr>`;
  }).join("");

  const tableHtml = filtered.length===0 ? `<div class="empty">Нет изменений за выбранный период.</div>` : `
    <div class="tablewrap"><div class="tscroll">
      <table>
        <thead><tr>
          ${ACT_COLUMNS.map(col=>{
            const active = activitySortCol===col.key;
            const arrow = active ? (activitySortDir==="asc" ? " ▲" : " ▼") : "";
            return `<th class="sortable${active?" sorted":""}" data-sort="${col.key}">${esc(col.label)}${arrow}</th>`;
          }).join("")}
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div></div>`;

  main.innerHTML = toolbarHtml + summaryHtml + tableHtml;

  document.getElementById("fActFrom").onchange = (e)=>{ activityDateFrom = e.target.value; renderManagerActivity(); };
  document.getElementById("fActTo").onchange = (e)=>{ activityDateTo = e.target.value; renderManagerActivity(); };
  document.getElementById("fActManager").onchange = (e)=>{ activityManagerFilter = e.target.value; renderManagerActivity(); };
  main.querySelectorAll("thead [data-sort]").forEach(th=>{
    th.onclick = ()=>{
      const col = th.getAttribute("data-sort");
      if (activitySortCol===col) activitySortDir = activitySortDir==="asc" ? "desc" : "asc";
      else { activitySortCol = col; activitySortDir = col==="at" ? "desc" : "asc"; }
      renderManagerActivity();
    };
  });
  main.querySelectorAll("tbody tr[data-id]").forEach(tr=> tr.onclick = ()=>openDrawer(tr.getAttribute("data-id")));
}
function activitySortValue(r, col){
  switch(col){
    case "company": return r.company||null;
    case "manager": return r.manager||null;
    case "field": return r.field||null;
    case "change": return (r.to||"");
    case "at": return r.at||null;
    default: return null;
  }
}

/* =====================================================================
   KPI VIEW — mirrors "KPI по менеджерам"
   ===================================================================== */
function bucketOf(c){
  if (c.tab==="dormant") return "dormant";
  if (c.source==="incoming") return "incoming";
  if (c.source==="outgoing") return "outgoing";
  return "incoming";
}
function clientsInKpiPeriod(){
  const all = Array.from(clients.values());
  if (!kpiPeriod.from && !kpiPeriod.to) return all;
  return all.filter(c=>{
    if (!c.registrationDate) return false;
    if (kpiPeriod.from && c.registrationDate < kpiPeriod.from) return false;
    if (kpiPeriod.to && c.registrationDate > kpiPeriod.to) return false;
    return true;
  });
}

function computeKpiData(){
  const managers = getManagers();
  const buckets = ["incoming","dormant","outgoing"];
  const bucketLabels = {incoming:"Входящая заявка", dormant:"Спящий клиент", outgoing:"Исходящий (сам нашёл)"};
  const source = clientsInKpiPeriod();

  function statsFor(list){
    const total = list.length;
    const done = list.filter(isConverted).length;
    return {total, done, conv: total? (done/total*100):0};
  }

  const perManager = managers.map(m=>{
    const own = source.filter(c=>c.manager===m);
    const byBucket = {};
    buckets.forEach(b=> byBucket[b] = statsFor(own.filter(c=>bucketOf(c)===b)) );
    const totalStats = statsFor(own);
    return {manager:m, byBucket, totalStats};
  }).filter(r=>r.totalStats.total>0);

  const grand = {};
  buckets.forEach(b=> grand[b] = statsFor(source.filter(c=>bucketOf(c)===b)) );
  const grandTotal = statsFor(source);

  return {managers, buckets, bucketLabels, statsFor, perManager, grand, grandTotal, source};
}

// Отдельная сводка по «Менеджеру ведения» (аккаунт-менеджеру) — независимая от
// таблицы выше, которая считает по «Менеджеру» (кто привёл клиента). Один и тот же
// клиент учитывается и там, и там — это разные роли, а не альтернативные варианты одной.
function computeAccountManagerBreakdown(source){
  function statsFor(list){
    const total = list.length;
    const done = list.filter(isConverted).length;
    return {total, done, conv: total? (done/total*100):0};
  }
  const accountManagers = getAccountManagers();
  const rows = accountManagers.map(m=>{
    const own = source.filter(c=>c.accountManager===m);
    return {manager:m, stats: statsFor(own)};
  }).filter(r=>r.stats.total>0);
  rows.sort((a,b)=> b.stats.total - a.stats.total);
  const grandTotal = statsFor(source.filter(c=>c.accountManager));
  return {rows, grandTotal};
}

/* =====================================================================
   АКТИВНОСТЬ МЕНЕДЖЕРОВ (только для владельца) — кто и когда поменял
   статус или отрасль по каждой компании. Собираем из statusHistory
   (реальные переходы — все записи, кроме самой первой при создании
   карточки) и changeLog (поле "Отрасль", там уже только правки).
   ===================================================================== */
function computeManagerActivityRows(source){
  const rows = [];
  source.forEach(c=>{
    const sh = Array.isArray(c.statusHistory) ? c.statusHistory : [];
    for (let i=1; i<sh.length; i++){
      const cur = sh[i], prev = sh[i-1];
      rows.push({
        clientId: c.id, company: c.company||"—", code: c.code||"",
        manager: cur.by || "—", field: "Статус",
        from: prev.status||"—", to: cur.status||"—", at: cur.at||"",
      });
    }
    const cl = Array.isArray(c.changeLog) ? c.changeLog : [];
    cl.forEach(ch=>{
      if (ch.field!=="Отрасль") return;
      rows.push({
        clientId: c.id, company: c.company||"—", code: c.code||"",
        manager: ch.by || "—", field: "Отрасль",
        from: ch.from||"—", to: ch.to||"—", at: ch.at||"",
      });
    });
  });
  return rows;
}
function computeManagerActivitySummary(rows){
  const byManager = new Map();
  rows.forEach(r=>{
    const key = r.manager || "—";
    if (!byManager.has(key)) byManager.set(key, {manager:key, companies:new Set(), changes:0});
    const bucket = byManager.get(key);
    bucket.companies.add(r.clientId);
    bucket.changes += 1;
  });
  const list = Array.from(byManager.values()).map(b=>({manager:b.manager, companies:b.companies.size, changes:b.changes}));
  list.sort((a,b)=> b.companies - a.companies);
  return list;
}

/* =====================================================================
   ГРАФИКИ ДАШБОРДА KPI — рукописный inline SVG (без внешних библиотек)
   ===================================================================== */
const KPI_MONTH_NAMES_RU = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

function computeMonthlyRegistrations(source){
  const map = new Map();
  source.forEach(c=>{
    const rd = c.registrationDate;
    if (!rd || !/^\d{4}-\d{2}/.test(rd)) return;
    const key = rd.slice(0,7);
    map.set(key, (map.get(key)||0)+1);
  });
  const keys = Array.from(map.keys()).sort();
  const last = keys.slice(-12); // не больше 12 последних месяцев — иначе график становится нечитаемым
  return last.map(k=>{
    const [y,m] = k.split("-").map(Number);
    return {label: `${KPI_MONTH_NAMES_RU[m-1]} ${String(y).slice(2)}`, value: map.get(k), key:k};
  });
}

function computeMonthlyTransfers(source){
  const map = new Map();
  source.forEach(c=>{
    if (c.status!=="Передан в дивизион") return;
    const td = c.transferDate;
    if (!td || !/^\d{4}-\d{2}/.test(td)) return;
    const key = td.slice(0,7);
    map.set(key, (map.get(key)||0)+1);
  });
  const keys = Array.from(map.keys()).sort();
  const last = keys.slice(-12);
  return last.map(k=>{
    const [y,m] = k.split("-").map(Number);
    return {label: `${KPI_MONTH_NAMES_RU[m-1]} ${String(y).slice(2)}`, value: map.get(k), key:k};
  });
}

function computeManagerConversionChart(perManager){
  return perManager
    .filter(r=>r.totalStats.total>0)
    .map(r=>({label:r.manager, value: r.totalStats.conv, total:r.totalStats.total, done:r.totalStats.done}))
    .sort((a,b)=>b.value-a.value);
}

// Сколько клиентов попадает в каждый сегмент (A/B/C/D) — цвет каждого столбца
// совпадает с цветом таких же плашек-сегментов в списке и карточке клиента.
function computeSegmentBreakdown(source){
  const defs = [
    {code:"A", colorVar:"--good"},
    {code:"B", colorVar:"--info"},
    {code:"C", colorVar:"--warn"},
    {code:"D", colorVar:"--neutral"},
  ];
  const counts = {A:0,B:0,C:0,D:0};
  const labels = {};
  source.forEach(c=>{
    const seg = computeScores(c).segment;
    if (seg && counts[seg.code]!=null){ counts[seg.code]++; labels[seg.code]=seg.label; }
  });
  return defs.map(d=>({label:d.code, value:counts[d.code], segLabel: labels[d.code]||"", colorVar:d.colorVar}));
}

// Сколько клиентов в каждом виде деятельности (отрасли), по убыванию, с пометкой
// дивизиона (Стандарт/Нестандарт) — та же логика, что определяет дивизион в карточке клиента.
function computeIndustryBreakdown(source){
  const map = new Map();
  source.forEach(c=>{
    const industry = c.industry || "Не указано";
    map.set(industry, (map.get(industry)||0)+1);
  });
  const rows = Array.from(map.entries()).map(([industry,count])=>{
    const division = (INDUSTRY_MAP.get(industry) || {division:"Стандарт"}).division;
    return {industry, count, division};
  });
  rows.sort((a,b)=> b.count-a.count || a.industry.localeCompare(b.industry,"ru"));
  return rows;
}

function niceAxisStep(maxVal){
  if (maxVal<=0) return {axisMax:1, step:1};
  const rough = maxVal/4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough/mag;
  let step;
  if (norm<1.5) step = 1*mag; else if (norm<3) step = 2*mag; else if (norm<7) step = 5*mag; else step = 10*mag;
  step = step || 1;
  const axisMax = Math.ceil(maxVal/step)*step;
  return {axisMax: axisMax||1, step};
}

function roundedTopBarPath(x,yTop,w,h,r){
  if (h<=0) return "";
  r = Math.max(0, Math.min(r, w/2, h));
  const yBase = yTop + h;
  if (r<=0.01) return `M${x},${yBase} L${x},${yTop} L${x+w},${yTop} L${x+w},${yBase} Z`;
  return `M${x},${yBase} L${x},${yTop+r} Q${x},${yTop} ${x+r},${yTop} L${x+w-r},${yTop} Q${x+w},${yTop} ${x+w},${yTop+r} L${x+w},${yBase} Z`;
}

// data: [{label, value, ...extra}]; opts: {colorVar, valueFmt, tickFmt, height}
function buildKpiBarChart(data, opts){
  opts = opts||{};
  const colorVar = opts.colorVar || "--accent";
  const valueFmt = opts.valueFmt || (v=>String(Math.round(v)));
  const tickFmt = opts.tickFmt || (v=>String(Math.round(v)));
  const width = 560, height = opts.height || 220;
  const pad = {top:18, right:10, bottom:28, left:34};
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const maxDataVal = Math.max(0, ...data.map(d=>d.value));
  const {axisMax, step} = niceAxisStep(maxDataVal);
  const n = Math.max(data.length,1);
  const slot = innerW / n;
  const barW = Math.max(8, Math.min(24, slot - 14));

  const yTicks = [];
  for (let v=0; v<=axisMax+1e-9; v+=step) yTicks.push(v);
  const yOf = v => pad.top + innerH - (axisMax>0 ? (v/axisMax)*innerH : 0);

  const gridSvg = yTicks.map(v=>{
    const yy = yOf(v);
    return `<line x1="${pad.left}" y1="${yy.toFixed(1)}" x2="${(pad.left+innerW).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`
      + `<text x="${(pad.left-7).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="10" fill="var(--text-faint)">${esc(tickFmt(v))}</text>`;
  }).join("");

  const barsSvg = data.map((d,i)=>{
    const cx = pad.left + slot*i + slot/2;
    const x = cx - barW/2;
    const barH = axisMax>0 ? Math.max(0,(d.value/axisMax))*innerH : 0;
    const yTop = pad.top + innerH - barH;
    const path = roundedTopBarPath(x, yTop, barW, barH, 4);
    const valueLabelY = Math.max(pad.top+9, yTop-6);
    return `<g class="kpi-bar-g" tabindex="0" data-idx="${i}">
      <path d="${path}" fill="var(${d.colorVar || colorVar})" class="kpi-bar-rect"/>
      <rect x="${(x-6).toFixed(1)}" y="${pad.top}" width="${(barW+12).toFixed(1)}" height="${innerH}" fill="transparent" class="kpi-bar-hit" data-idx="${i}"/>
      <text x="${cx.toFixed(1)}" y="${valueLabelY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">${esc(valueFmt(d.value))}</text>
      <text x="${cx.toFixed(1)}" y="${(pad.top+innerH+15).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(d.label.length>10? d.label.slice(0,9)+"…" : d.label)}</text>
    </g>`;
  }).join("");

  const svg = `<svg viewBox="0 0 ${width} ${height}" class="kpi-chart-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="диаграмма">
    ${gridSvg}
    <line x1="${pad.left}" y1="${(pad.top+innerH).toFixed(1)}" x2="${(pad.left+innerW).toFixed(1)}" y2="${(pad.top+innerH).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    ${barsSvg}
  </svg>`;
  return svg;
}

// Линейный график — для трендов во времени (месяц к месяцу), тот же формат
// data/opts, что и у buildKpiBarChart, и те же классы у точек (kpi-bar-g/kpi-bar-hit),
// поэтому подсказка (wireKpiChart) работает без изменений для обоих типов графиков.
function buildKpiLineChart(data, opts){
  opts = opts||{};
  const colorVar = opts.colorVar || "--accent";
  const valueFmt = opts.valueFmt || (v=>String(Math.round(v)));
  const tickFmt = opts.tickFmt || (v=>String(Math.round(v)));
  const width = 560, height = opts.height || 220;
  const pad = {top:18, right:14, bottom:28, left:34};
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const maxDataVal = Math.max(0, ...data.map(d=>d.value));
  const {axisMax, step} = niceAxisStep(maxDataVal);
  const n = data.length;
  const xOf = i => n>1 ? pad.left + (innerW/(n-1))*i : pad.left + innerW/2;
  const yOf = v => pad.top + innerH - (axisMax>0 ? (v/axisMax)*innerH : 0);

  const yTicks = [];
  for (let v=0; v<=axisMax+1e-9; v+=step) yTicks.push(v);
  const gridSvg = yTicks.map(v=>{
    const yy = yOf(v);
    return `<line x1="${pad.left}" y1="${yy.toFixed(1)}" x2="${(pad.left+innerW).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`
      + `<text x="${(pad.left-7).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="10" fill="var(--text-faint)">${esc(tickFmt(v))}</text>`;
  }).join("");

  const linePoints = data.map((d,i)=> `${xOf(i).toFixed(1)},${yOf(d.value).toFixed(1)}`).join(" ");

  const pointsSvg = data.map((d,i)=>{
    const cx = xOf(i), cy = yOf(d.value);
    const valueLabelY = Math.max(pad.top+9, cy-10);
    return `<g class="kpi-bar-g" tabindex="0" data-idx="${i}">
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(${colorVar})" class="kpi-bar-rect"/>
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="14" fill="transparent" class="kpi-bar-hit" data-idx="${i}"/>
      <text x="${cx.toFixed(1)}" y="${valueLabelY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">${esc(valueFmt(d.value))}</text>
      <text x="${cx.toFixed(1)}" y="${(pad.top+innerH+15).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(d.label.length>10? d.label.slice(0,9)+"…" : d.label)}</text>
    </g>`;
  }).join("");

  const svg = `<svg viewBox="0 0 ${width} ${height}" class="kpi-chart-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="диаграмма">
    ${gridSvg}
    <line x1="${pad.left}" y1="${(pad.top+innerH).toFixed(1)}" x2="${(pad.left+innerW).toFixed(1)}" y2="${(pad.top+innerH).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <polyline points="${linePoints}" fill="none" stroke="var(${colorVar})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pointsSvg}
  </svg>`;
  return svg;
}

function buildKpiChartCard(opts){
  // opts: {id, title, data, colorVar, valueFmt, tickFmt, tooltipFmt(d), tableHead, tableRow(d), chartFn}
  // chartFn — buildKpiBarChart (по умолчанию, для сравнения по категориям) или
  // buildKpiLineChart (для трендов по месяцам) — оба рисуют в одном формате точек,
  // так что подсказка и переключатель "Таблица" работают одинаково для обоих.
  const {id, title, data} = opts;
  if (!data.length){
    return `<div class="chart-card">
      <div class="chart-card-head"><h3>${esc(title)}</h3></div>
      <div class="chart-empty">Нет данных за выбранный период</div>
    </div>`;
  }
  const chartFn = opts.chartFn || buildKpiBarChart;
  const svg = chartFn(data, opts);
  const rows = data.map(opts.tableRow).join("");
  return `<div class="chart-card" data-chart-id="${id}">
    <div class="chart-card-head">
      <h3>${esc(title)}</h3>
      <button type="button" class="chart-table-toggle" data-toggle-for="${id}">Таблица</button>
    </div>
    <table class="chart-table" id="tbl_${id}">
      <thead><tr>${opts.tableHead}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="chart-card-wrap" id="wrap_${id}">${svg}</div>
  </div>`;
}

function wireKpiChart(id, data, tooltipFmt, tooltipEl){
  const wrap = document.getElementById("wrap_"+id);
  if (!wrap) return;
  const groups = wrap.querySelectorAll(".kpi-bar-g");
  groups.forEach(g=>{
    const idx = parseInt(g.getAttribute("data-idx"),10);
    const d = data[idx];
    const show = (clientX, clientY)=>{
      tooltipEl.innerHTML = tooltipFmt(d);
      tooltipEl.classList.add("show");
      const ttW = tooltipEl.offsetWidth||160, ttH = tooltipEl.offsetHeight||40;
      let left = clientX + 14, top = clientY - ttH - 10;
      if (left + ttW > window.innerWidth - 8) left = clientX - ttW - 14;
      if (top < 8) top = clientY + 14;
      tooltipEl.style.left = left+"px";
      tooltipEl.style.top = top+"px";
    };
    const hide = ()=> tooltipEl.classList.remove("show");
    g.addEventListener("pointermove", e=> show(e.clientX, e.clientY));
    g.addEventListener("pointerenter", e=> show(e.clientX, e.clientY));
    g.addEventListener("pointerleave", hide);
    g.addEventListener("focus", ()=>{
      const rect = g.querySelector(".kpi-bar-hit").getBoundingClientRect();
      show(rect.left+rect.width/2, rect.top);
    });
    g.addEventListener("blur", hide);
  });
  const toggleBtn = document.querySelector(`.chart-table-toggle[data-toggle-for="${id}"]`);
  const tbl = document.getElementById("tbl_"+id);
  if (toggleBtn && tbl){
    toggleBtn.onclick = ()=>{
      const showing = tbl.classList.toggle("show");
      toggleBtn.textContent = showing ? "График" : "Таблица";
    };
  }
}

/* =====================================================================
   EXCEL EXPORT — дашборд KPI (руками собранный .xlsx, без внешних библиотек)
   ===================================================================== */
function xmlEsc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function xlsxColLetter(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xlsxCell(colIdx, rowIdx, val, opts){
  opts = opts||{};
  const ref = xlsxColLetter(colIdx)+rowIdx;
  const styleAttr = opts.style!=null ? ` s="${opts.style}"` : "";
  if (opts.type==="Number" && val!==""&&val!=null&&!isNaN(val)){
    return `<c r="${ref}"${styleAttr}><v>${val}</v></c>`;
  }
  const text = xmlEsc(val==null?"":String(val));
  return `<c r="${ref}"${styleAttr} t="inlineStr"><is><t xml:space="preserve">${text}</t></is></c>`;
}
function xlsxRow(rowIdx, cells){
  return `<row r="${rowIdx}">${cells.map((c,i)=>xlsxCell(i+1, rowIdx, c.val, c)).join("")}</row>`;
}
function xlsxSheetXml(rows){
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.join("")}</sheetData></worksheet>`;
}

// --- минимальный ZIP-контейнер (метод "store", без сжатия) — из него состоит .xlsx ---
const XLSX_CRC_TABLE = (()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[n]=c>>>0; } return t; })();
function xlsxCrc32(bytes){ let crc=0xFFFFFFFF; for(let i=0;i<bytes.length;i++){ crc = XLSX_CRC_TABLE[(crc^bytes[i])&0xFF] ^ (crc>>>8); } return (crc^0xFFFFFFFF)>>>0; }
function xlsxDosDateTime(d){
  const dosDate = (((d.getFullYear()-1980)&0x7F)<<9) | (((d.getMonth()+1)&0xF)<<5) | (d.getDate()&0x1F);
  const dosTime = ((d.getHours()&0x1F)<<11) | ((d.getMinutes()&0x3F)<<5) | (Math.floor(d.getSeconds()/2)&0x1F);
  return {dosDate, dosTime};
}
function makeZip(files){ // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder();
  const {dosDate, dosTime} = xlsxDosDateTime(new Date());
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  files.forEach(f=>{
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = xlsxCrc32(data);
    const size = data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true);
    cdv.setUint16(14, dosDate, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });

  const centralSize = centralParts.reduce((s,p)=>s+p.length,0);
  const centralOffset = offset;
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function buildXlsxBlob(sheets){ // sheets: [{name, rows}], rows: массив строк-массивов {val,type,style}
  const enc = new TextEncoder();
  const sheetXmls = sheets.map(sh => xlsxSheetXml(sh.rows.map((cells,i)=>xlsxRow(i+1, cells))));

  const overrideParts = sheets.map((sh,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("");
  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrideParts}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

  const sheetTags = sheets.map((sh,i)=>`<sheet name="${xmlEsc(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("");
  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetTags}</sheets></workbook>`;

  const sheetRels = sheets.map((sh,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("");
  const stylesRelId = sheets.length+1;
  const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheetRels}<Relationship Id="rId${stylesRelId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEFEF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="1" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;

  const files = [
    {name:"[Content_Types].xml", data: enc.encode(contentTypesXml)},
    {name:"_rels/.rels", data: enc.encode(rootRelsXml)},
    {name:"xl/workbook.xml", data: enc.encode(workbookXml)},
    {name:"xl/_rels/workbook.xml.rels", data: enc.encode(workbookRelsXml)},
    {name:"xl/styles.xml", data: enc.encode(stylesXml)},
  ];
  sheetXmls.forEach((xml,i)=> files.push({name:`xl/worksheets/sheet${i+1}.xml`, data: enc.encode(xml)}));

  return makeZip(files);
}

function saveBlobAsFile(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
